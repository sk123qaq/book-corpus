# pre-commit / pre-push：提交前跑代码与文档检查，推送前自动跑并行快测。
#
# 全员用同一个 gate，所以 hook 走本地 venv（uv run），不需要联网拉 hook 环境。
# 钩子本体是仓库里的 .githooks/（无绝对路径，换机器/换克隆目录不用重装），每个克隆配置一次：
#   tools/install_git_hooks.sh        # = uv sync --frozen + git config core.hooksPath .githooks
# 不要再跑 `pre-commit install`：它会把当前 venv 的 python 绝对路径写死进 .git/hooks/，
# 换台机器就失效；配置了 core.hooksPath 后它也会主动拒绝安装。
#
# 提交前八道闸（pre-commit）：
#   1. ruff-check   —— 全仓规则，等于 `ruff check`，自动修能修的（修过即失败，重跑即可）
#   2. ruff-format  —— 格式化，等于 `ruff format`
#   3. ruff-strict  —— 「新代码」严格档：不在 .ruff-legacy-files.txt 里的文件额外禁止
#                      os.path 拼接（PTH）和 % 格式化（UP031），见 tools/ruff_strict_new.py
#   4. mypy         —— 核心包 src/bookcorpus 的类型检查（口径见 pyproject.toml 的 [tool.mypy]）
#   5. docs-check   —— 文档对账：生成块是否落后于代码、状态头、旧路径、相对链接、端口
#   6. living-docs-sync —— 活文档一致性：.agents/skills 清单、正文反引号路径、
#                      ops 路由、CLI 子命令与退役词守卫，见 tools/check_docs_sync.py
#   7. docs-coupling —— 代码→文档失效源耦合提醒：暂存区代码命中某文档的 `失效源：`
#                      但文档未一起暂存时打印提醒（先警告不阻断），见 tools/check_docs_coupling.py
#   8. js-syntax    —— 前端脚本 `node --check` 语法校验
#
# 推送前（pre-push）：
#   9. pytest-fast  —— 离线并行快测（`-n auto --dist worksteal -m "not real_corpus" --maxfail=5`）
#
# CI（.github/workflows/ci.yml）的 checks job 跑第 1–6、8 道；test job 跑第 9 道全量与冒烟；本地不通、线上必红。
#
# 紧急绕过：SKIP=ruff-strict git commit -m "..."（只跳过严格档）

default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-strict
        name: ruff strict (new code only)
        entry: uv run python tools/ruff_strict_new.py
        language: system
        types_or: [python, pyi]
        require_serial: true
      # mypy 只查核心包（pyproject 里 files = ["src/bookcorpus"]），与前三个同一条口径。
      - id: mypy
        name: mypy (src/bookcorpus)
        entry: uv run mypy
        language: system
        pass_filenames: false
        files: ^src/bookcorpus/
        require_serial: true
      # 文档与代码对账。没有 --data-root 时数字项自动 skip；facts 由 `book-corpus docs write` 更新。
      - id: docs-check
        name: docs check
        entry: uv run book-corpus docs check
        language: system
        pass_filenames: false
        files: \.(md|py|toml)$
        require_serial: true
      # 活文档与技能目录一致性。`docs check` 不管 .agents/、退役词与正文里的仓库路径，这层补上。
      - id: living-docs-sync
        name: living docs sync (skills, paths & retired terms)
        entry: uv run python tools/check_docs_sync.py --strict
        language: system
        pass_filenames: false
        files: \.(md|py|toml)$
        require_serial: true
      # 提交级耦合提醒：暂存区代码命中某文档的 `失效源：` 但文档未同步修改时打印提醒（不阻断提交）。
      - id: docs-coupling
        name: docs coupling (source-to-doc reminder)
        entry: uv run python tools/check_docs_coupling.py
        language: system
        pass_filenames: false
        verbose: true
        require_serial: true
      # 前端原生 JS 语法检查：node --check 只检查第一个参数，因此逐个文件检查。
      - id: js-syntax
        name: js syntax (node --check)
        entry: bash -c 'for f in "$@"; do node --check "$f" || exit 1; done' --
        language: system
        files: ^(apps|tests/acceptance/ops)/.*\.js$
        require_serial: true
      # 推送前自动跑离线并行全量快测，防跳过本地检查把坏提交推上远程。
      - id: pytest-fast
        name: pytest fast (pre-push)
        entry: uv run --frozen pytest -n auto --dist worksteal -m "not real_corpus" --maxfail=5
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
        require_serial: true
