<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1E8" id="meta-theme-color">
<title>书库操作台 v2 · 精简重构原型</title>
<style>
  /* ==========================================================================
     1. Design Tokens (ui-ux-pro-max: Minimalism & Swiss Style, density 6)
     ========================================================================== */
  :root {
    color-scheme: light;
    --paper: #F4F1E8;
    --paper-deep: #EAE4D6;
    --surface: #FCF9F2;
    --surface-subtle: #EFEAE0;
    --surface-hover: #F5F0E4;

    --ink: #181817;
    --ink-2: #4E4A42;
    --ink-3: #686258; /* >= 4.8:1 contrast on --surface & --paper */

    --line: #D8D1C2;
    --line-strong: #BEB6A4;

    --cinnabar: #A8442F;
    --cinnabar-hover: #8E3725;
    --cinnabar-soft: oklch(0.51 0.14 31 / 0.10);
    --cinnabar-ring: oklch(0.51 0.14 31 / 0.28);

    --pine: #1E5A4C;
    --pine-soft: oklch(0.42 0.08 168 / 0.11);

    --amber: #87500E;
    --amber-soft: oklch(0.58 0.12 72 / 0.14);

    --danger: #B42318;
    --danger-soft: oklch(0.48 0.18 27 / 0.11);

    --term-bg: #1D1C19;
    --term-ink: #EAE5D9;

    /* Layered translucent shadows for depth (make-interfaces-feel-better) */
    --shadow-surface:
      0 0 0 1px oklch(0 0 0 / 0.06),
      0 1px 2px -1px oklch(0 0 0 / 0.055),
      0 2px 6px 0 oklch(0 0 0 / 0.03);
    --shadow-surface-hover:
      0 0 0 1px oklch(0 0 0 / 0.11),
      0 2px 6px -1px oklch(0 0 0 / 0.075),
      0 6px 14px -2px oklch(0 0 0 / 0.05);
    --shadow-control:
      0 0 0 1px oklch(0 0 0 / 0.10),
      0 1px 2px 0 oklch(0 0 0 / 0.05);
    --shadow-control-hover:
      0 0 0 1px oklch(0 0 0 / 0.18),
      0 2px 4px 0 oklch(0 0 0 / 0.07);
    --shadow-dialog:
      0 0 0 1px oklch(0 0 0 / 0.08),
      0 14px 36px -6px oklch(0 0 0 / 0.18),
      0 24px 48px -12px oklch(0 0 0 / 0.14);

    --img-outline: 1px solid oklch(0 0 0 / 0.1);

    /* Spacing scale (Standard / Calm: 16-24px rhythm) */
    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 18px;
    --sp-5: 22px;
    --sp-6: 28px;

    /* Concentric Radii: outer = inner + padding */
    --r-card: 14px;
    --r-inner: 8px;
    --r-control: 8px;
    --r-dialog: 16px;

    --sidebar-w: 224px;

    --serif: "Noto Serif CJK SC", "Songti SC", "Source Han Serif SC", Georgia, serif;
    --sans: "Noto Sans CJK SC", "PingFang SC", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

    --ease-out: cubic-bezier(0.2, 0, 0, 1);
  }

  html[data-theme="night"] {
    color-scheme: dark;
    --paper: #161716;
    --paper-deep: #1D1F1D;
    --surface: #1F211F;
    --surface-subtle: #272A27;
    --surface-hover: #2C302C;

    --ink: #EAE6DC;
    --ink-2: #B8B2A6;
    --ink-3: #969084;

    --line: #333633;
    --line-strong: #464A46;

    --cinnabar: #DF745D;
    --cinnabar-hover: #EB8872;
    --cinnabar-soft: oklch(0.67 0.14 31 / 0.16);
    --cinnabar-ring: oklch(0.67 0.14 31 / 0.36);

    --pine: #6CB8A6;
    --pine-soft: oklch(0.72 0.08 168 / 0.14);

    --amber: #E4A84E;
    --amber-soft: oklch(0.74 0.12 72 / 0.16);

    --danger: #F07167;
    --danger-soft: oklch(0.68 0.16 27 / 0.16);

    --term-bg: #111211;
    --term-ink: #E5E1D6;

    --shadow-surface: 0 0 0 1px oklch(1 0 0 / 0.09);
    --shadow-surface-hover: 0 0 0 1px oklch(1 0 0 / 0.16);
    --shadow-control: 0 0 0 1px oklch(1 0 0 / 0.12);
    --shadow-control-hover: 0 0 0 1px oklch(1 0 0 / 0.22);
    --shadow-dialog:
      0 0 0 1px oklch(1 0 0 / 0.14),
      0 20px 50px -8px oklch(0 0 0 / 0.65);

    --img-outline: 1px solid oklch(1 0 0 / 0.1);
  }

  /* ==========================================================================
     2. Base & Typography
     ========================================================================== */
  *, *::before, *::after { box-sizing: border-box; }

  html {
    background: var(--paper);
    scroll-padding-top: 24px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    -webkit-tap-highlight-color: oklch(0.51 0.14 31 / 0.16);
  }

  @media (pointer: fine) {
    html { overscroll-behavior: none; }
  }

  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.58;
    overflow-x: hidden;
    touch-action: manipulation;
  }

  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }

  h1, h2, h3 {
    margin: 0;
    text-wrap: balance;
    scroll-margin-top: 20px;
  }

  h1 {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.25;
  }

  h2 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--ink);
  }

  h3 {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
  }

  p { margin: 0; text-wrap: pretty; }

  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .tnum { font-variant-numeric: tabular-nums; }
  .muted { color: var(--ink-3); }
  .small { font-size: 12.5px; }
  .nowrap { white-space: nowrap; }

  :focus-visible {
    outline: 2px solid var(--cinnabar);
    outline-offset: 2px;
  }

  .skip-link {
    position: fixed;
    top: -64px;
    left: 16px;
    z-index: 100;
    padding: 8px 14px;
    border-radius: var(--r-control);
    background: var(--ink);
    color: var(--surface);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    transition-property: top;
    transition-duration: 150ms;
    transition-timing-function: var(--ease-out);
  }
  .skip-link:focus { top: 12px; }

  /* ==========================================================================
     3. App Shell (Fixed Sidebar + Calm Workspace)
     ========================================================================== */
  .app-shell {
    display: grid;
    grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
    min-height: 100dvh;
  }

  .sidebar {
    position: sticky;
    top: 0;
    height: 100dvh;
    background: var(--surface);
    border-right: 1px solid var(--line);
    padding: var(--sp-4) var(--sp-3);
    padding-left: max(var(--sp-3), env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    gap: var(--sp-4);
    min-width: 0;
    z-index: 20;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 6px 12px;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
  }

  .brand-seal {
    width: 30px;
    height: 30px;
    border-radius: 7px;
    background: var(--cinnabar);
    color: #FCF9F2;
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 700;
    display: grid;
    place-items: center;
    flex: none;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22);
  }

  .brand-meta { display: flex; flex-direction: column; min-width: 0; }
  .brand-title { font-family: var(--serif); font-size: 15px; font-weight: 700; letter-spacing: 0.1em; line-height: 1.2; white-space: nowrap; }
  .brand-sub { font-size: 11px; color: var(--ink-3); }

  .side-nav {
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
  }

  .nav-link {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 40px;
    padding: 8px 10px 8px 12px;
    border-radius: var(--r-control);
    color: var(--ink-2);
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 500;
    white-space: nowrap;
    transition-property: background-color, color;
    transition-duration: 140ms;
    transition-timing-function: var(--ease-out);
  }

  .nav-link svg {
    width: 17px;
    height: 17px;
    flex: none;
    opacity: 0.78;
    transition-property: opacity;
    transition-duration: 140ms;
    transition-timing-function: var(--ease-out);
  }

  .nav-link:hover { background: var(--surface-subtle); color: var(--ink); }
  .nav-link:hover svg { opacity: 1; }

  .nav-link[aria-current="page"] {
    background: var(--cinnabar-soft);
    color: var(--cinnabar);
    font-weight: 600;
  }
  .nav-link[aria-current="page"] svg { opacity: 1; }
  .nav-link[aria-current="page"]::before {
    content: "";
    position: absolute;
    left: 2px;
    top: 9px;
    bottom: 9px;
    width: 3px;
    border-radius: 999px;
    background: var(--cinnabar);
  }

  .nav-label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

  .nav-badge {
    font-family: var(--mono);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--amber-soft);
    color: var(--amber);
    font-weight: 600;
  }
  .nav-link[aria-current="page"] .nav-badge { background: var(--cinnabar); color: #fff; }

  .side-footer {
    border-top: 1px solid var(--line);
    padding-top: var(--sp-3);
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
  }

  .workspace { display: flex; flex-direction: column; min-width: 0; }

  /* Topbar: streamlined 4 KPIs + Demo Mode Switch + Quick Search */
  .topbar {
    min-height: 54px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 9px var(--sp-6);
    padding-right: max(var(--sp-6), env(safe-area-inset-right));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-3);
    flex-wrap: wrap;
  }

  .kpi-strip {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px 18px;
    min-width: 0;
  }

  .kpi-item {
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    font-size: 12.5px;
    color: var(--ink-3);
    white-space: nowrap;
  }

  .kpi-item b {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }
  .kpi-item.ok b { color: var(--pine); }
  .kpi-item.warn b { color: var(--amber); }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    flex-wrap: wrap;
  }

  /* Segmented Control (Live vs Populated Demo Mode / Ledger Filter) */
  .seg {
    display: inline-flex;
    align-items: center;
    padding: 3px;
    border-radius: 10px;
    background: var(--surface-subtle);
    border: 1px solid var(--line);
    gap: 2px;
  }

  .seg-btn {
    position: relative;
    border: 0;
    background: transparent;
    color: var(--ink-3);
    font-size: 12px;
    font-weight: 500;
    min-height: 28px;
    padding: 4px 10px;
    border-radius: 7px; /* outer 10 - pad 3 = 7 */
    white-space: nowrap;
    transition-property: background-color, color, box-shadow;
    transition-duration: 130ms;
    transition-timing-function: var(--ease-out);
  }
  .seg-btn::after { content: ""; position: absolute; inset: -4px 0; }
  .seg-btn:hover { color: var(--ink); }
  .seg-btn[aria-pressed="true"] {
    background: var(--surface);
    color: var(--ink);
    font-weight: 600;
    box-shadow: var(--shadow-control);
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex: none;
    background: var(--line-strong);
  }
  .dot.on { background: var(--pine); box-shadow: 0 0 0 2px var(--pine-soft); }

  main {
    flex: 1 1 auto;
    padding: var(--sp-5) var(--sp-6) 76px;
    padding-right: max(var(--sp-6), env(safe-area-inset-right));
    max-width: 1200px;
    width: 100%;
    min-width: 0;
  }

  .page-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: var(--sp-3);
    margin-bottom: var(--sp-4);
    flex-wrap: wrap;
  }

  .page-lead {
    margin-top: 4px;
    font-size: 13.5px;
    color: var(--ink-2);
    max-width: 68ch;
  }

  .section { margin-bottom: var(--sp-5); }

  /* ==========================================================================
     4. Surfaces, Buttons & Micro-interactions (make-interfaces-feel-better)
     ========================================================================== */
  .card {
    background: var(--surface);
    border-radius: var(--r-card);
    padding: var(--sp-4) var(--sp-5);
    box-shadow: var(--shadow-surface);
    min-width: 0;
  }

  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-3);
    margin-bottom: var(--sp-3);
    flex-wrap: wrap;
  }

  .grid { display: grid; gap: var(--sp-4); }
  .grid.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: stretch; }

  .btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 36px;
    padding: 6px 14px;
    border: 0;
    border-radius: var(--r-control);
    background: var(--surface);
    color: var(--ink);
    font-size: 13px;
    font-weight: 500;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    box-shadow: var(--shadow-control);
    transition-property: background-color, box-shadow, color, scale;
    transition-duration: 140ms;
    transition-timing-function: var(--ease-out);
  }
  .btn::after { content: ""; position: absolute; inset: -2px -2px; }
  .btn.has-icon-left { padding-left: 12px; padding-right: 14px; }
  .btn.has-icon-right { padding-left: 14px; padding-right: 12px; }
  .btn svg { width: 15px; height: 15px; flex: none; }

  .btn:hover:not(:disabled) { background: var(--surface-hover); box-shadow: var(--shadow-control-hover); }
  .btn:active:not(:disabled) { scale: 0.96; }

  .btn.primary {
    background: var(--cinnabar);
    color: #FFFFFF;
    box-shadow: 0 0 0 1px oklch(0.42 0.14 31 / 0.35), 0 1px 2px 0 oklch(0 0 0 / 0.14);
  }
  .btn.primary:hover:not(:disabled) {
    background: var(--cinnabar-hover);
    box-shadow: 0 0 0 1px oklch(0.38 0.14 31 / 0.45), 0 2px 6px 0 oklch(0.42 0.14 31 / 0.25);
  }

  .btn.danger { background: var(--danger); color: #FFFFFF; box-shadow: 0 0 0 1px oklch(0.4 0.18 27 / 0.4); }
  .btn.danger:hover:not(:disabled) { background: #961C13; }

  .btn.ghost { background: transparent; box-shadow: none; color: var(--ink-2); }
  .btn.ghost:hover:not(:disabled) { background: var(--surface-subtle); color: var(--ink); box-shadow: none; }

  .btn.sm { min-height: 32px; padding: 4px 11px; font-size: 12.5px; border-radius: 7px; }
  .btn.sm::after { inset: -4px -2px; }
  .btn:disabled { opacity: 0.46; cursor: not-allowed; }

  .icon-btn {
    position: relative;
    width: 36px;
    height: 36px;
    padding: 0;
    border: 0;
    border-radius: var(--r-control);
    background: var(--surface);
    color: var(--ink-2);
    display: inline-grid;
    place-items: center;
    box-shadow: var(--shadow-control);
    transition-property: background-color, color, box-shadow, scale;
    transition-duration: 140ms;
    transition-timing-function: var(--ease-out);
  }
  .icon-btn::after { content: ""; position: absolute; inset: -4px; }
  .icon-btn:hover { background: var(--surface-hover); color: var(--ink); box-shadow: var(--shadow-control-hover); }
  .icon-btn:active { scale: 0.96; }

  /* Contextual Icon Cross-Fade (scale 0.25->1, opacity 0->1, blur 4px->0px, 300ms) */
  .icon-swap { position: relative; width: 17px; height: 17px; display: inline-block; }
  .icon-swap svg {
    position: absolute;
    inset: 0;
    width: 17px;
    height: 17px;
    transition-property: opacity, filter, scale;
    transition-duration: 300ms;
    transition-timing-function: var(--ease-out);
  }
  .icon-swap .icon-b { opacity: 0; scale: 0.25; filter: blur(4px); }
  .icon-swap.swapped .icon-a { opacity: 0; scale: 0.25; filter: blur(4px); }
  .icon-swap.swapped .icon-b { opacity: 1; scale: 1; filter: blur(0px); }

  /* Inputs */
  input[type="text"],
  input[type="search"],
  input[type="number"],
  select {
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    padding: 6px 10px;
    min-height: 34px;
    background-color: var(--surface);
    color: var(--ink);
    font-size: 13px;
    max-width: 100%;
    transition-property: border-color, box-shadow;
    transition-duration: 130ms;
    transition-timing-function: var(--ease-out);
  }
  input:hover:not(:read-only), select:hover { border-color: var(--ink-3); }
  input:focus-visible, select:focus-visible {
    outline: none;
    border-color: var(--cinnabar);
    box-shadow: 0 0 0 3px var(--cinnabar-ring);
  }

  .filter-group {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 6px;
    border-radius: 10px;
    background: var(--surface-subtle);
    border: 1px solid var(--line);
  }
  .filter-group:focus-within { border-color: var(--cinnabar); box-shadow: 0 0 0 2px var(--cinnabar-ring); }
  .filter-group input { border: 0; background: transparent; min-height: 28px; padding: 2px 6px; }
  .filter-group input:focus-visible { box-shadow: none; }

  .check-label {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 32px;
    padding: 2px 4px;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
    user-select: none;
  }
  .check-label input[type="checkbox"] {
    position: relative;
    width: 16px;
    height: 16px;
    margin: 0;
    accent-color: var(--cinnabar);
    cursor: pointer;
  }
  .check-label input[type="checkbox"]::after { content: ""; position: absolute; inset: -10px; }

  /* Status & Pills */
  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-2);
    white-space: nowrap;
  }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); flex: none; }
  .status.ok { color: var(--pine); }
  .status.ok::before { background: var(--pine); }
  .status.half { color: var(--amber); }
  .status.half::before { background: var(--amber); }
  .status.miss { color: var(--danger); }
  .status.miss::before { background: var(--danger); }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 500;
    line-height: 1.45;
    white-space: nowrap;
    border: 1px solid var(--line);
    background: var(--surface-subtle);
    color: var(--ink-2);
  }
  .pill.ok { background: var(--pine-soft); border-color: color-mix(in srgb, var(--pine) 35%, transparent); color: var(--pine); }
  .pill.half { background: var(--amber-soft); border-color: color-mix(in srgb, var(--amber) 35%, transparent); color: var(--amber); }
  .pill.miss { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 35%, transparent); color: var(--danger); }

  /* ==========================================================================
     5. Semantic Sub-Tabs (modern-web-guidance: tabs)
     ========================================================================== */
  @property --fade-start { syntax: "<length>"; inherits: false; initial-value: 0px; }
  @property --fade-end { syntax: "<length>"; inherits: false; initial-value: 0px; }

  .subtabs {
    display: flex;
    align-items: center;
    flex-wrap: nowrap;
    overflow-x: auto;
    gap: 4px;
    margin-bottom: var(--sp-4);
    border-bottom: 1px solid var(--line);
    scrollbar-width: none;
    scroll-padding-inline: 24px;
    --fade-size: 24px;
    mask:
      linear-gradient(black, black) no-clip subtract,
      linear-gradient(to right, black, transparent) 0 0 / var(--fade-start) 100% no-repeat no-clip,
      linear-gradient(to right, transparent, black) 100% 0 / var(--fade-end) 100% no-repeat no-clip;
    animation: reveal-fade-start linear both, hide-fade-end linear both;
    animation-timeline: scroll(self inline);
    animation-range: 0 var(--fade-size), calc(100% - var(--fade-size)) 100%;
  }
  .subtabs::-webkit-scrollbar { display: none; }
  @keyframes reveal-fade-start { to { --fade-start: var(--fade-size); } }
  @keyframes hide-fade-end { from { --fade-end: var(--fade-size); } }

  .subtab {

  /* ==========================================================================
     6. Module Layouts
     ========================================================================== */
  /* Overview Hero + Pipeline */
  .hero-card {
    display: grid;
    grid-template-columns: minmax(0, 1.45fr) minmax(260px, 0.9fr);
    gap: var(--sp-5);
    align-items: center;
    background: var(--surface);
    border-radius: var(--r-card);
    padding: var(--sp-5);
    box-shadow: var(--shadow-surface);
  }
  .hero-eyebrow { font-size: 11.5px; letter-spacing: 0.12em; color: var(--cinnabar); font-weight: 600; margin-bottom: 6px; }
  .verdict { font-family: var(--serif); font-size: 20px; font-weight: 600; line-height: 1.4; margin-bottom: 6px; text-wrap: balance; }
  .hero-note { font-size: 13px; color: var(--ink-2); margin-bottom: var(--sp-4); }
  .hero-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); }

  .hero-meter {

  .meter-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .meter-pct { font-family: var(--mono); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .meter-bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; display: flex; }
  .meter-fill-ok { background: var(--pine); height: 100%; }
  .meter-fill-warn { background: var(--amber); height: 100%; }
  .meter-legend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; font-size: 11.5px; color: var(--ink-2); }
  .meter-legend div b { display: block; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink); }

  .pipeline { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--sp-2); }
  .pipe-cell {
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 13px 14px;
    border-radius: var(--r-card);

    text-decoration: none;
    min-width: 0;
    transition-property: box-shadow, background-color, transform;
    transition-duration: 150ms;
    transition-timing-function: var(--ease-out);

  .pipe-cell:hover { background: var(--surface-hover); box-shadow: var(--shadow-surface-hover); transform: translateY(-1px); }
  .pipe-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .pipe-step { font-family: var(--mono); font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .pipe-name { font-size: 14px; font-weight: 600; color: var(--ink); margin-top: 2px; }
  .pipe-read { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

  /* Full-width Todo & Service Strip */
  .rowline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-3);
    padding: 11px 0;

  .rowline:first-child { padding-top: 2px; }

  .rl-main { min-width: 0; flex: 1 1 auto; }

  .rl-note { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

  .svc-bar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-3); }
  .svc-item {
    display: flex;
    align-items: center;

  .svc-meta { display: flex; align-items: center; gap: 9px; min-width: 0; }

  .svc-port { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  /* Horizontal Drop Bar (#import top-to-bottom flow) */
  .drop-bar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-4);
    flex-wrap: wrap;

    border-radius: var(--r-card);
    background: var(--surface);

  .drop-bar-left { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1 1 300px; }
  .drop-icon {

    height: 40px;
    border-radius: 10px;
    background: var(--cinnabar-soft);

  /* Empty State */
  .empty-state {
    padding: 22px 16px;
    border-radius: var(--r-inner);

  /* Status Strip & Stat Cards */
  .strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-2); }
  .strip-cell {

    flex-direction: column;

  .strip-read { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
  .strip-note { font-size: 11.5px; color: var(--ink-2); }

  /* Progress */
  .progress { height: 7px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--cinnabar); }

  /* Banners & Toolbars */
  .banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px 14px;
    border-radius: var(--r-inner);
    border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent);
    background: var(--amber-soft);
    color: var(--ink);
    margin-bottom: var(--sp-3);

  .banner.ok { border-color: color-mix(in srgb, var(--pine) 40%, transparent); background: var(--pine-soft); }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
    margin-bottom: var(--sp-3);

  .spacer { flex: 1 1 auto; }

  .adv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: var(--sp-3); margin-top: var(--sp-3); }
  .adv-item {

    flex-direction: column;
    justify-content: space-between;
    gap: 10px;

  details.adv summary {
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
    padding: 4px 0;
    list-style-position: inside;
  }
  details.adv summary::marker { color: var(--cinnabar); }

  /* ==========================================================================
     7. Responsive Data Tables (modern-web-guidance: responsive-table)
     ========================================================================== */
  .table-wrap {
    width: 100%;
    overflow: auto;
    max-inline-size: 100%;
    max-block-size: min(520px, 68dvh);
    container-type: inline-size;
    border: 1px solid var(--line);
    border-radius: var(--r-inner);
    background: var(--surface);
  }
  .table-wrap:focus-visible { outline: 2px solid var(--cinnabar); outline-offset: 2px; }

  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
  thead { position: sticky; inset-block-start: 0; z-index: 2; }
  th, td {
    text-align: left;
    padding: 9px 11px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
    white-space: nowrap;
  }
  th { background: var(--surface-subtle); color: var(--ink-2); font-size: 12px; font-weight: 600; letter-spacing: 0.03em; }
  td.wrap { white-space: normal; min-width: 160px; }
  td.clip { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  tbody tr { transition-property: background-color; transition-duration: 100ms; transition-timing-function: var(--ease-out); }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: var(--surface-hover); }
  tbody tr.row-review td { background: var(--amber-soft); }
  tbody tr.row-active td { background: var(--cinnabar-soft); }

  .table-wrap input[type="checkbox"] {
    position: relative;
    width: 16px;
    height: 16px;
    margin: 0;
    accent-color: var(--cinnabar);
    cursor: pointer;
  }
  .table-wrap input[type="checkbox"]::after { content: ""; position: absolute; inset: -7px; }

  @container (width < 600px) {
    .stack-mobile table,
    .stack-mobile thead,
    .stack-mobile tbody,
    .stack-mobile tr,
    .stack-mobile th,
    .stack-mobile td { display: block; }
    .stack-mobile thead { display: none; }
    .stack-mobile tbody tr { padding: 10px 12px; border-bottom: 1px solid var(--line); }
    .stack-mobile tbody td {
      padding: 3px 0;
      border: 0;
      white-space: normal;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      text-align: right;
    }
    .stack-mobile tbody td[data-label]::before {

      color: var(--ink-3);
      font-size: 12px;
      font-weight: 500;
      text-align: left;
      flex: none;

  }

  /* Logs */
  #job-detail { scroll-margin-top: 20px; transition-property: box-shadow; transition-duration: 300ms; transition-timing-function: var(--ease-out); }
  #job-detail.detail-focus { box-shadow: 0 0 0 2px var(--cinnabar), 0 8px 24px -6px var(--cinnabar-ring); }

  pre.log {

    overflow: auto;
    white-space: pre-wrap;

  }

  /* ==========================================================================
     8. Native Modal <dialog> (modern-web-guidance: dialog)
     ========================================================================== */
  dialog {
    margin: auto;
    border: 0;
    padding: 0;

  @keyframes dialog-in {
    from { opacity: 0; transform: translateY(8px) scale(0.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .dlg-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--sp-3);
    padding: var(--sp-4) var(--sp-5) var(--sp-3);
    border-bottom: 1px solid var(--line);
  }
  .dlg-body { padding: var(--sp-4) var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-3); overflow-y: auto; flex: 1 1 auto; }
  .dlg-foot {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: var(--sp-2);
    padding: var(--sp-3) var(--sp-5) var(--sp-4);
    border-top: 1px solid var(--line);
    background: var(--surface-subtle);
  }

  .thumb-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .thumb-frame {
    width: 124px;
    height: 164px;
    border-radius: 6px;
    background: #fff;
    outline: var(--img-outline);
    outline-offset: -1px;

  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: max(20px, env(safe-area-inset-bottom));
    transform: translate(-50%, 10px);
    background: var(--term-bg);
    color: var(--term-ink);
    padding: 9px 16px;

    font-size: 13px;

  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .toast.bad { background: var(--danger); color: #fff; }

  /* ==========================================================================
     9. Responsive Breakpoints (1440 / 1024 / 390)
     ========================================================================== */
  .mobile-only { display: none; }

  @media (max-width: 1080px) {

    .svc-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  @media (max-width: 820px) {

  }

    if (inboxN) todos.push({ title: `核对收件箱 ${inboxN} 本新书并入库`, note: '已完成书名与分类建议识别，确认后即可建库', href: '#import', label: '去入库', primary: !awaitingN });
    todos.push({ title: `排入 ${fmt(c.pdfConvert)} 本已分诊 PDF 转写`, note: '83 本图册与设定集已按政策自动归入存档，不占转写额度', href: '#pdf', label: '去选书', primary: !awaitingN && !inboxN });
    todos.push({ title: `复核 ${fmt(c.ledgerPending)} 本书目分类建议`, note: '保存修改后自动同步书目与浏览入口', href: '#ledger', label: '去复核', primary: false });
    todos.push({ title: `按需扩展 ${fmt(c.expandUncovered)} 本书主题前缀`, note: `已有 ${fmt(c.expandCovered)} 本完成覆盖，此项按需触发不影响全文搜索`, href: '#maintain', label: '去查看', primary: false });

    return `

        <div>

          <div class="hero-actions">
            <a class="btn primary has-icon-right" href="${primaryHref}">
              <span>${esc(primaryLabel)}</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </a>
            <button type="button" class="btn has-icon-left" id="btn-refresh-overview">
              <span class="icon-swap" id="refresh-icon-swap" aria-hidden="true">
                <svg class="icon-a" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
                <svg class="icon-b" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>

              <span>刷新状态</span>

          </div>
        </div>
        <div class="hero-meter">
          <div class="meter-top">
            <span class="small muted">正文可读率</span>
            <span class="meter-pct">${pct}%</span>
          </div>
          <div class="meter-bar" role="img" aria-label="正文可读率 ${pct}%">
            <div class="meter-fill-ok" style="width:${pct}%"></div>
            <div class="meter-fill-warn" style="width:${(100 - Number(pct)).toFixed(1)}%"></div>
          </div>
          <div class="meter-legend">
            <div><span class="muted">已有正文</span><b>${fmt(c.readable)}</b></div>
            <div><span class="muted">待转 PDF</span><b>${fmt(c.pdfConvert)}</b></div>
            <div><span class="muted">政策存档</span><b>${fmt(c.pdfGallery)}</b></div>
          </div>

      <section class="section" aria-label="六步书库流水线">

          ${pipeline.map((p) => `
            <a class="pipe-cell" href="${p.href}">

  /* ==========================================================================
     2. 新书入库 (纵向三步流：投递条 -> 收件箱 -> 入库清单，彻底告别并排高低不齐)

    const busy = isBusy();
    const inbox = busy ? BUSY_OVERLAY.inbox : [];
    const plan = busy ? BUSY_OVERLAY.plan : [];

    return `
      <div class="page-head">
        <div>
          <h1>新书入库</h1>

        </div>
      </div>

      ${busy ? `
        <div class="banner ok">
          <span>后台提示：新入库的文本或 Office 文档会自动转为章节正文，可在「文档转正文」查看进度。</span>
          <a class="btn sm" href="#docs">查看文档转换 →</a>
        </div>` : ''}

      <section class="section" aria-label="投递新书">

            <span class="drop-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>

              <span class="small muted">支持 EPUB、MOBI、AZW3、PDF、TXT、DOCX、XLSX、PPTX，单文件不超过 2&nbsp;GB（拖拽到此即可）</span>
            </span>
          </span>
          <span class="btn sm primary">选择文件</span>
        </button>
        <input type="file" id="mock-file-input" hidden multiple accept=".epub,.pdf,.mobi,.azw3,.txt,.md,.docx,.xlsx,.pptx">
      </section>

      <section class="card section" aria-label="收件箱清单">
        <div class="card-head">
          <div style="display:flex;align-items:center;gap:8px">

          <div style="display:flex;gap:8px;flex-wrap:wrap">

            <button type="button" class="btn sm primary" id="btn-scan-inbox"${inbox.length ? '' : ' disabled'}>生成入库清单</button>

          <div class="table-wrap stack-mobile" tabindex="0" role="region" aria-label="收件箱文件表">

              <thead><tr><th>文件名</th><th>格式</th><th class="num">大小</th><th>放入时间</th></tr></thead>
              <tbody>
                ${inbox.map((f) => `<tr>
                  <td data-label="文件名" class="wrap">${esc(f.name)}</td>
                  <td data-label="格式" class="mono" translate="no">${esc(f.format)}</td>
                  <td data-label="大小" class="num">${esc(f.size)}</td>
                  <td data-label="放入时间" class="small muted">${esc(f.time)}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>` : `
          <div class="empty-state">
            <div>
              <div class="empty-state-title">收件箱当前是空的</div>
              <div class="empty-state-sub">点击上方「选择文件」或直接把电子书拖进投递条，即可准备入库。</div>
            </div>
            <button type="button" class="btn sm" data-switch-mode="busy">预览有新书待核对的样子</button>
          </div>`}
      </section>

      <section class="card" aria-label="入库核对清单">
        <div class="card-head">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <h2>入库核对清单</h2>
            ${plan.length ? '<span class="pill">新增 1 · 换源 1 · 待核 1</span>' : ''}
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button type="button" class="btn sm" id="btn-plan-accept-all"${plan.length ? '' : ' disabled'}>采用建议分类</button>
            <button type="button" class="btn sm primary" id="btn-plan-apply"${plan.length ? '' : ' disabled'}>确认入库</button>

        </div>
        ${plan.length ? `
          <div class="banner">
            <span>第 3 行（地方志整理凡例.docx）需要人工核对作者或动作后再入库。</span>

            <table>
              <thead>
                <tr><th>动作</th><th>原文件</th><th>正式书名</th><th>作者</th><th>分类</th><th>保留</th><th>编号</th><th>说明</th></tr>
              </thead>
              <tbody>
                ${plan.map((r, i) => `
                  <tr class="${r.action === 'review' ? 'row-review' : ''}">
                    <td data-label="动作">
                      <select name="plan_act_${i}" aria-label="第 ${i + 1} 行动作">
                        <option value="add"${r.action === 'add' ? ' selected' : ''}>新增</option>
                        <option value="replace"${r.action === 'replace' ? ' selected' : ''}>换源</option>
                        <option value="review"${r.action === 'review' ? ' selected' : ''}>待核</option>
                        <option value="delete"${r.action === 'delete' ? ' selected' : ''}>删除</option>
                      </select>
                    </td>
                    <td data-label="原文件" class="wrap">

                      <div class="small muted mono">${esc(r.fmt)}</div>

                    <td data-label="作者"><input type="text" name="plan_author_${i}" aria-label="第 ${i + 1} 行作者" value="${esc(r.author)}" autocomplete="off" style="width:130px"></td>

                      <select name="plan_keep_${i}" aria-label="第 ${i + 1} 行保留策略">
                        <option value="keep"${r.keep === 'keep' ? ' selected' : ''}>保留</option>
                        <option value="review"${r.keep === 'review' ? ' selected' : ''}>待定</option>
                        <option value="drop"${r.keep === 'drop' ? ' selected' : ''}>不留</option>

              </tbody>

              <div class="empty-state-title">还没有待核对的入库清单</div>

  /* ==========================================================================
     3. 书目与分类 (3 个子页全量重构：去路径/去最近任务/清爽双层工具栏)

  function renderLedger(subtab) {
    const busy = isBusy();
    const retireDrop = busy ? BUSY_OVERLAY.retireDrop : [];
    const head = `
      <div class="page-head">
        <div>
          <h1>书目与分类</h1>
          <p class="page-lead">修改书名、分类或保留策略后即刻生效，并自动同步阅读与检索。</p>
        </div>
      </div>
      ${subtabsHtml([
        ['ledger', '分类与全库台账', 0],
        ['retire', '待退库与删书', retireDrop.length],
        ['cold', '冷宫（只读专区）', LIVE_CORPUS.cold.length],
      ], subtab)}`;

    if (subtab === 'retire') {
      const rq = STATE.retireQ.trim().toLowerCase();
      const hits = rq
        ? LIVE_CORPUS.ledger.filter((b) => b.uid.toLowerCase().includes(rq) || b.title.toLowerCase().includes(rq))
        : [];
      return head + `<div class="tabpanel" role="tabpanel" aria-labelledby="subtab-retire">
        <section class="card section" aria-label="查找并移出书目">
          <div class="card-head">
            <h2>按编号或书名查找移出</h2>
            <span class="small muted">移出后原书保留在冷宫，阅读版与检索记录同步清理</span>
          </div>
          <div class="toolbar" style="margin-bottom:${hits.length ? '14px' : '0'}">
            <div class="filter-group">
              <label for="retire-q" class="small muted" style="padding-left:4px">查找</label>
              <input type="search" id="retire-q" name="retire_q" autocomplete="off" spellcheck="false" value="${esc(STATE.retireQ)}" placeholder="输入编号或书名，如 B0511…" style="width:220px">
            </div>
            <button type="button" class="btn sm" id="btn-retire-demo-q">试搜 B0511</button>
          </div>
          ${hits.length ? `
            <div class="table-wrap stack-mobile" tabindex="0" role="region" aria-label="搜书结果表">
              <table>
                <thead><tr><th>编号</th><th>书名</th><th>分类</th><th>状态</th><th>操作</th></tr></thead>
                <tbody>
                  ${hits.map((b) => `<tr>
                    <td data-label="编号" class="mono" translate="no">${esc(b.uid)}</td>
                    <td data-label="书名" class="wrap">${esc(b.title)}</td>
                    <td data-label="分类" class="small muted">${esc(b.cat1)} · ${esc(b.cat2)}</td>
                    <td data-label="状态"><span class="pill">${KEEP_WORD[b.keep]}</span></td>
                    <td data-label="操作"><button type="button" class="btn sm danger" data-open-retire="${esc(b.uid)}" data-title="${esc(b.title)}">预览移出</button></td>
                  </tr>`).join('')}
                </tbody>
              </table>
            </div>` : (rq ? '<p class="small muted">没有找到匹配的书目，请换个编号或关键词。</p>' : '')}
        </section>

        <section class="card" aria-label="已标为不留的书目">
          <div class="card-head">
            <h2>已标为“不留”的书目</h2>
            <span class="pill">${fmt(retireDrop.length)} 本</span>
          </div>
          ${retireDrop.length ? `
            <div class="table-wrap stack-mobile" tabindex="0" role="region" aria-label="待退库表">
              <table>
                <thead><tr><th>编号</th><th>书名</th><th>分类</th><th class="num">章数</th><th class="num">奖项</th><th>操作</th></tr></thead>
                <tbody>
                  ${retireDrop.map((b) => `<tr>
                    <td data-label="编号" class="mono" translate="no">${esc(b.uid)}</td>
                    <td data-label="书名" class="wrap">${esc(b.title)}</td>
                    <td data-label="分类" class="small muted">${esc(b.cat)}</td>
                    <td data-label="章数" class="num">${fmt(b.chapters)}</td>
                    <td data-label="奖项" class="num">${fmt(b.awards)}</td>
                    <td data-label="操作"><button type="button" class="btn sm danger" data-open-retire="${esc(b.uid)}" data-title="${esc(b.title)}">预览移出</button></td>
                  </tr>`).join('')}
                </tbody>
              </table>
            </div>` : `
            <div class="empty-state">
              <div>
                <div class="empty-state-title">当前没有标记为“不留”的书</div>
                <div class="empty-state-sub">在全库台账里把某本书的保留策略改为「不留」，它会汇总到这里等待最终确认移出。</div>
              </div>
            </div>`}
        </section>
      </div>`;
    }

    if (subtab === 'cold') {
      return head + `<div class="tabpanel" role="tabpanel" aria-labelledby="subtab-cold">
        <section class="card" aria-label="冷宫只读归档">
          <div class="card-head">
            <div style="display:flex;align-items:center;gap:8px">
              <h2>冷宫归档书目（只读）</h2>
              <span class="pill">${fmt(LIVE_CORPUS.cold.length)} 本</span>

          <div class="table-wrap stack-mobile" tabindex="0" role="region" aria-label="冷宫归档表">
            <table>
              <thead><tr><th>书名</th><th>编号</th><th>来源</th><th>格式与体积</th><th>移出原因</th><th>归档时间</th></tr></thead>

                ${LIVE_CORPUS.cold.map((c) => `<tr>
                  <td data-label="书名" class="wrap">${esc(c.title)}</td>

    // Ledger main subtab (Clean 2-row header, NO ledger.db path, merged Category column)
    const q = STATE.ledgerQ.trim().toLowerCase();
    const rows = LIVE_CORPUS.ledger.filter((r) => {
      if (STATE.ledgerScope === 'pending' && !r.pending) return false;
      if (!q) return true;
      return [r.uid, r.title, r.cat1, r.cat2, r.note].some((x) => x.toLowerCase().includes(q));
    });
    const pickedN = STATE.ledgerPicked.size;

    return head + `<div class="tabpanel" role="tabpanel" aria-labelledby="subtab-ledger">
      <section class="card" aria-label="全库书目台账">
        <div class="card-head">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <h2>全库书目台账</h2>
            <span class="pill">${fmt(LIVE_CORPUS.books)} 本</span>
            <span class="pill half">${fmt(LIVE_CORPUS.ledgerPending)} 本待复核</span>

          <button type="button" class="btn sm" id="btn-ledger-refresh">刷新</button>
        </div>

        <div class="toolbar">
          <div class="filter-group">

            <button type="button" class="seg-btn" data-ledger-scope="all" aria-pressed="${STATE.ledgerScope === 'all'}">全部书目</button>

  function renderSplit(subtab) {

    const ebooks = busy ? BUSY_OVERLAY.ebooks : [];
    const docsPend = busy ? BUSY_OVERLAY.docsPending : [];
    const manualPend = busy ? BUSY_OVERLAY.manualPending : [];

    const head = `
      <div class="page-head">
        <div>
          <h1>正文生产</h1>
          <p class="page-lead">把电子书、文档与 PDF 转为章节正文；完成后自动更新书目与检索。</p>

      </div>
      ${subtabsHtml([
        ['split', '电子书', ebooks.length],
        ['docs', '文档转正文', docsPend.length],
        ['pdf', 'PDF 分诊与转写', LIVE_CORPUS.pdfConvert],
        ['manual', '手工格式', manualPend.length],

    if (subtab === 'docs') {
      const doneN = LIVE_CORPUS.docsHistory.length;
      return head + `<div class="tabpanel" role="tabpanel" aria-labelledby="subtab-docs">
        <section class="card section" aria-label="文档转正文状态">
          <div class="card-head">
            <div>
              <h2>文档转正文</h2>
              <p class="small muted">TXT、DOCX、XLSX、PPTX 入库后会自动转换；这里用于补转历史遗漏或核对转换结果。</p>
            </div>
            <button type="button" class="btn sm primary" id="btn-docs-run">扫描并补转遗漏</button>
          </div>
          <div class="strip">
            <div class="strip-cell"><div class="strip-name">待补转文档</div><div class="strip-read">${fmt(docsPend.length)} 本</div><div class="strip-note">${docsPend.length ? '等待转换' : '当前无遗漏'}</div></div>
            <div class="strip-cell"><div class="strip-name">最近一批完成</div><div class="strip-read">${fmt(doneN)} 本</div><div class="strip-note">全部顺利通过</div></div>
            <div class="strip-cell"><div class="strip-name">失败待重试</div><div class="strip-read">0 本</div><div class="strip-note">无异常文件</div></div>
            <div class="strip-cell"><div class="strip-name">整体状态</div><div class="strip-read"><span class="status ${docsPend.length ? 'half' : 'ok'}">${docsPend.length ? '待处理' : '全部就绪'}</span></div><div class="strip-note">自动同步检索已启用</div></div>
          </div>
        </section>

        <section class="card" aria-label="文档转换明细">
          ${docsPend.length ? `
            <div class="card-head"><h2>待转文档列表</h2><span class="pill half">${fmt(docsPend.length)} 本</span></div>
            <div class="table-wrap stack-mobile" tabindex="0" role="region" aria-label="待转文档表">
              <table>
                <thead><tr><th>编号</th><th>书名</th><th>分类</th><th>格式</th><th class="num">大小</th></tr></thead>
                <tbody>
                  ${docsPend.map((d) => `<tr>
                    <td data-label="编号" class="mono" translate="no">${esc(d.uid)}</td>
                    <td data-label="书名" class="wrap">${esc(d.title)}</td>
                    <td data-label="分类" class="small muted">${esc(d.cat)}</td>
                    <td data-label="格式" class="mono">${esc(d.format)}</td>
                    <td data-label="大小" class="num">${esc(d.size)}</td>
                  </tr>`).join('')}
                </tbody>
              </table>
            </div>` : `
            <div class="empty-state" style="margin-bottom:14px">
              <div>
                <div class="empty-state-title">全部文档类书目都已转为正文</div>
                <div class="empty-state-sub">新入库文档会自动接力转换，一般无需手工介入。</div>

            <details class="adv">
              <summary>查看最近一次转换明细（${fmt(doneN)} 本全部完成）</summary>
              <div class="table-wrap stack-mobile" style="margin-top:10px" tabindex="0" role="region" aria-label="最近转换明细表">
                <table>
                  <thead><tr><th>编号</th><th>书名</th><th>格式</th><th class="num">字数</th><th>状态</th></tr></thead>
                  <tbody>
                    ${LIVE_CORPUS.docsHistory.map((it) => `<tr>
                      <td data-label="编号" class="mono" translate="no">${esc(it.uid)}</td>
                      <td data-label="书名" class="wrap">${esc(it.title)}</td>
                      <td data-label="格式" class="mono">${esc(it.format)}</td>
                      <td data-label="字数" class="num">${fmt(it.chars)}</td>
                      <td data-label="状态"><span class="pill ok">${esc(it.status)}</span></td>

      </div>`;

    if (subtab === 'pdf') {
      const q = STATE.pdfQ.trim().toLowerCase();
      const rows = LIVE_CORPUS.pdfs.filter((p) => {
        if (STATE.pdfFilter !== 'all' && p.disp !== STATE.pdfFilter) return false;
        if (!q) return true;
        return p.uid.toLowerCase().includes(q) || p.title.toLowerCase().includes(q);
      });
      return head + `<div class="tabpanel" role="tabpanel" aria-labelledby="subtab-pdf">
        <section class="card section" aria-label="PDF 队列与今日额度">
          <div class="card-head">
            <h2>PDF 状态概览</h2>
            <span class="small muted tnum">今日识别额度：已用 <b>0</b> / 20,000&nbsp;页</span>
          </div>
          <div class="strip" style="margin-bottom:12px">
            <button type="button" class="strip-cell" data-pdf-filter-card="convert" aria-pressed="${STATE.pdfFilter === 'convert'}">
              <span class="strip-name">可转</span>
              <span class="strip-read">${fmt(LIVE_CORPUS.pdfConvert)} 本</span>

            <button type="button" class="strip-cell" data-pdf-filter-card="untriaged" aria-pressed="${STATE.pdfFilter === 'untriaged'}">
              <span class="strip-name">未分诊</span>
              <span class="strip-read">${fmt(LIVE_CORPUS.pdfUntriaged)} 本</span>

        <section class="card" aria-label="待转 PDF 清单">

            <h2>待转 PDF 清单</h2>

            </div>
          </div>
          <div class="toolbar">
            <div class="filter-group">
              <label for="pdf-q" class="small muted" style="padding-left:4px">搜索</label>

            <select id="pdf-disp-filter" name="pdf_filter">
              <option value="all"${STATE.pdfFilter === 'all' ? ' selected' : ''}>全部状态</option>
              <option value="convert"${STATE.pdfFilter === 'convert' ? ' selected' : ''}>可转</option>
              <option value="untriaged"${STATE.pdfFilter === 'untriaged' ? ' selected' : ''}>未分诊</option>
              <option value="gallery"${STATE.pdfFilter === 'gallery' ? ' selected' : ''}>存档·图册</option>
              <option value="ja"${STATE.pdfFilter === 'ja' ? ' selected' : ''}>存档·非中英文</option>
            </select>
          </div>
          <div class="table-wrap stack-mobile" tabindex="0" role="region" aria-label="PDF 清单表">
            <table>
              <thead><tr><th style="width:36px">选</th><th>编号</th><th>书名</th><th>处置</th><th class="num">页数</th><th>说明</th><th>操作</th></tr></thead>
              <tbody>
                ${rows.length ? rows.map((r) => `<tr>
                  <td data-label="选"><input type="checkbox" aria-label="选择 ${esc(r.title)}" data-pdf-pick="${esc(r.uid)}"${STATE.pdfPicked.has(r.uid) ? ' checked' : ''}></td>
                  <td data-label="编号" class="mono" translate="no">${esc(r.uid)}</td>
                  <td data-label="书名" class="wrap">${esc(r.title)}</td>
                  <td data-label="处置"><span class="pill ${r.disp === 'convert' ? 'ok' : ''}">${esc(r.route)}</span></td>
                  <td data-label="页数" class="num">${fmt(r.pages)}</td>
                  <td data-label="说明" class="clip small muted" title="${esc(r.note)}">${esc(r.note)}</td>
                  <td data-label="操作"><button type="button" class="btn sm" data-open-pdf="${esc(r.uid)}">改处置</button></td>
                </tr>`).join('') : '<tr><td colspan="7" class="small muted" style="text-align:center;padding:18px">当前筛选条件下没有 PDF 书目。</td></tr>'}
              </tbody>
            </table>
          </div>
        </section>
      </div>`;
    }

    if (subtab === 'manual') {
      return head + `<div class="tabpanel" role="tabpanel" aria-labelledby="subtab-manual">
        <section class="card" aria-label="手工格式处理">
          <div class="card-head">
            <h2>手工格式书目（DJVU / CSV）</h2>

                <thead><tr><th>编号</th><th>书名</th><th>格式</th><th>状态</th></tr></thead>
                <tbody>
                  ${manualPend.map((m) => `<tr>

      ${busy && BUSY_OVERLAY.staging.length ? `

          <h2>待拆章节的电子书</h2>
          ${ebooks.length ? `<button type="button" class="btn sm primary" id="btn-split-run">开始拆章 (${fmt(STATE.splitPicked.size)})</button>` : '<span class="pill ok">0 本待拆</span>'}

              <thead><tr><th style="width:36px">选</th><th>编号</th><th>书名</th><th>格式</th><th class="num">大小</th></tr></thead>
              <tbody>
                ${ebooks.map((e) => `<tr>
                  <td data-label="选"><input type="checkbox" aria-label="选择 ${esc(e.title)}" data-split-pick="${esc(e.uid)}"${STATE.splitPicked.has(e.uid) ? ' checked' : ''}></td>

                  <td data-label="书名" class="wrap">${esc(e.title)}</td>
                  <td data-label="格式" class="mono">${esc(e.format)}</td>
                  <td data-label="大小" class="num">${esc(e.size)}</td>

          </div>` : `
          <div class="empty-state">

              <div class="empty-state-title">全部电子书均已完成拆章</div>

            </div>
            <button type="button" class="btn sm" data-switch-mode="busy">预览有待拆电子书的样子</button>
          </div>`}
      </section>
    </div>`;
  }

        <details class="adv">
          <summary>高级运维与重建（低频 · 仅整理碎片或异常排查时使用）</summary>
          <div class="adv-grid">
            <div class="adv-item">
              <div><h3>压缩冗余语块</h3><p class="small muted" style="margin-top:4px">回收删书与换源留下的旧向量碎片，纯本地整理不重跑模型。</p></div>
              <button type="button" class="btn sm" data-adv-op="压缩冗余语块">执行压缩</button>
            </div>
            <div class="adv-item">
              <div><h3>重建全文检索</h3><p class="small muted" style="margin-top:4px">从头重新构建全文索引，耗时较长，仅异常恢复时使用。</p></div>
              <button type="button" class="btn sm" data-adv-op="重建全文检索">全量重建</button>
            </div>
            <div class="adv-item">
              <div><h3>深度体检</h3><p class="small muted" style="margin-top:4px">逐书核对源文件、正文与索引一致性，适合批量迁移后使用。</p></div>
              <button type="button" class="btn sm" data-adv-op="深度体检">运行深度体检</button>
            </div>
            <div class="adv-item">
              <div><h3>清理旧任务记录</h3><p class="small muted" style="margin-top:4px">清理 90 天前的任务日志与临时预览图，不影响书目与正文。</p></div>
              <button type="button" class="btn sm" data-adv-op="清理旧任务记录">清理旧记录</button>
            </div>
          </div>
        </details>
      </section>`;
  }

  /* ==========================================================================
     6. 任务与日志 (全站唯一任务中心)
     ========================================================================== */
  function renderLogs() {
    const jobs = allJobs();
    const rows = jobs.filter((j) => !STATE.logFilter || j.state === STATE.logFilter);
    const job = jobs.find((j) => j.id === STATE.selectedJobId) || jobs[0];
    const [jWord, jCls] = JOB_WORD[job.state] || [job.state, ''];

    return `
      <div class="page-head">
        <div>
          <h1>任务与日志</h1>
          <p class="page-lead">全库所有后台任务的唯一查看与人工收口中心。</p>
        </div>
      </div>

      <section class="card section" aria-label="任务列表">
        <div class="toolbar">
          <div class="seg" role="group" aria-label="任务状态筛选">
            ${[['', '全部'], ['awaiting_review', '待确认'], ['succeeded', '已完成'], ['failed', '失败']].map(([k, lbl]) => `
              <button type="button" class="seg-btn" data-log-filter="${k}" aria-pressed="${STATE.logFilter === k}">${lbl}</button>`).join('')}
          </div>
          <span class="spacer"></span>
          <span class="small muted tnum">共 ${fmt(rows.length)} 个任务</span>
        </div>

        <div class="table-wrap stack-mobile" tabindex="0" role="region" aria-label="任务列表">
          <table>
            <thead><tr><th>创建时间</th><th>类型</th><th>任务与摘要</th><th>状态</th><th class="num">耗时</th><th>操作</th></tr></thead>
            <tbody>
              ${rows.length ? rows.map((j) => {
                const [w, cls] = JOB_WORD[j.state] || [j.state, ''];
                const active = j.id === job.id;
                return `<tr class="${active ? 'row-active' : ''}">
                  <td data-label="创建时间" class="mono small">${esc(j.created)}</td>
                  <td data-label="类型" class="small">${esc(j.kind)}</td>
                  <td data-label="任务与摘要" class="wrap">
                    <div style="font-weight:500">${esc(j.title)}</div>
                    <div class="small muted">${esc(j.summary)}</div>
                  </td>
                  <td data-label="状态"><span class="pill ${cls}">${esc(w)}</span></td>
                  <td data-label="耗时" class="num">${esc(j.duration)}</td>
                  <td data-label="操作" class="nowrap">
                    <button type="button" class="btn sm${active ? ' primary' : ''}" data-select-job="${esc(j.id)}">详情</button>
                  </td>
                </tr>`;
              }).join('') : '<tr><td colspan="6" class="small muted" style="text-align:center;padding:18px">该状态下暂无任务记录。</td></tr>'}
            </tbody>
          </table>
        </div>
      </section>

      <section class="card${STATE.focusDetail ? ' detail-focus' : ''}" id="job-detail" tabindex="-1" aria-label="任务详情">
        <div class="card-head">
          <div>
            <h2>${esc(job.title)}</h2>
            <p class="small muted mono" translate="no">任务号 ${esc(job.id)} · 耗时 ${esc(job.duration)}</p>
          </div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <span class="pill ${jCls}">${esc(jWord)}</span>
            <button type="button" class="btn sm" id="btn-job-rerun">重跑</button>
          </div>
        </div>

        ${job.state === 'awaiting_review' ? `
          <div class="banner">
            <div style="flex:1 1 260px"><b>待确认收口：</b>${esc(job.summary)}。</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <a class="btn sm" href="#split">去正文生产处理</a>
              <button type="button" class="btn sm primary" data-resolve-job="${esc(job.id)}">确认已处理</button>
            </div>
          </div>` : ''}

        <div class="table-wrap" tabindex="0" role="region" aria-label="任务步骤表" style="margin-bottom:12px">
          <table>
            <thead><tr><th>#</th><th>步骤</th><th>状态</th><th>说明</th><th>开始</th></tr></thead>
            <tbody>
              ${job.steps.map((s) => `<tr>
                <td class="num">${s.seq}</td>
                <td>${esc(s.name)}</td>
                <td><span class="pill ${s.state === 'ok' ? 'ok' : 'half'}">${esc(s.state === 'ok' ? '通过' : '待定')}</span></td>
                <td class="wrap small">${esc(s.detail)}</td>
                <td class="mono small">${esc(s.started)}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>

        <details class="adv">
          <summary>技术诊断：运行命令与日志尾部</summary>
          <pre class="log" style="margin-top:8px" translate="no">${esc(job.commands)}\n\n${esc(job.log)}</pre>
        </details>
      </section>`;
  }

  /* ==========================================================================
     Router & Event Wiring
     ========================================================================== */
  function render() {
    const tab = parseHash();
    STATE.tab = tab;
    setActiveNav(tab);
    syncTopBadges();

    let html = '';
    if (tab === 'overview') html = renderOverview();
    else if (tab === 'import') html = renderImport();
    else if (tab === 'ledger' || tab === 'retire' || tab === 'cold') html = renderLedger(tab);
    else if (tab === 'split' || tab === 'docs' || tab === 'pdf' || tab === 'manual') html = renderSplit(tab);
    else if (tab === 'maintain') html = renderMaintain();
    else if (tab === 'logs') html = renderLogs();

    mainEl.innerHTML = html;

    const activeNav = document.querySelector('#primary-nav .nav-link[aria-current="page"]');
    if (activeNav) activeNav.scrollIntoView({ block: 'nearest', inline: 'nearest', container: 'nearest' });
    const activeTab = mainEl.querySelector('[role="tab"][aria-selected="true"]');
    if (activeTab) activeTab.scrollIntoView({ block: 'nearest', inline: 'nearest', container: 'nearest' });

    if (STATE.focusDetail && tab === 'logs') {
      STATE.focusDetail = false;
      const detail = document.getElementById('job-detail');
      if (detail) {
        detail.scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
        setTimeout(() => detail.classList.remove('detail-focus'), 1200);
      }
    }
  }

  function setupDialog(id, onConfirm) {
    const dlg = document.getElementById(id);
    if (!dlg) return;
    dlg.addEventListener('close', () => {
      if (dlg.returnValue === 'confirm' && onConfirm) onConfirm();
      dlg.returnValue = '';
    });
    if (!('closedBy' in HTMLDialogElement.prototype)) {
      const outside = (e) => {
        const r = dlg.getBoundingClientRect();
        return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
      };
      let pressedOut = false;
      dlg.addEventListener('pointerdown', (e) => { pressedOut = outside(e); });
      dlg.addEventListener('pointerup', (e) => { if (pressedOut && outside(e)) dlg.close(''); });
    }
  }

  setupDialog('pdf-dialog', () => {
    const row = LIVE_CORPUS.pdfs.find((p) => p.uid === STATE.activePdfUid);
    const sel = document.getElementById('pdf-route-select');
    if (row && sel) {
      row.route = sel.value;
      row.disp = sel.value === '存档·图册' ? 'gallery' : (sel.value === '存档·非中英文' ? 'ja' : 'convert');
      toast(`已将 ${row.uid} 处置设为「${sel.value}」`);
      render();
    }
  });
  setupDialog('retire-dialog');

  document.getElementById('retire-apply-btn').addEventListener('click', () => {
    const expected = document.getElementById('retire-expected-uid').textContent.trim();
    const typed = document.getElementById('retire-confirm-uid').value.trim();
    const checked = document.getElementById('retire-check').checked;
    if (typed !== expected) {
      toast(`确认编号不匹配：请输入 ${expected}`, true);
      document.getElementById('retire-confirm-uid').focus();
      return;
    }
    if (!checked) {
      toast('请先勾选确认复选框', true);
      document.getElementById('retire-check').focus();
      return;
    }
    document.getElementById('retire-dialog').close('');
    toast(`演示三道闸校验通过：${expected} 已移入冷宫`);
  });

  function setDemoMode(mode) {
    STATE.demoMode = mode;
    document.getElementById('mode-live').setAttribute('aria-pressed', String(mode === 'live'));
    document.getElementById('mode-busy').setAttribute('aria-pressed', String(mode === 'busy'));
    if (mode === 'busy') STATE.selectedJobId = BUSY_OVERLAY.awaitingJob.id;
    else STATE.selectedJobId = LIVE_CORPUS.jobs[0].id;
    render();
    toast(mode === 'busy' ? '已切换至「模拟有待办」视图态' : '已切换至「当前真库」视图态');
  }
  document.getElementById('mode-live').addEventListener('click', () => setDemoMode('live'));
  document.getElementById('mode-busy').addEventListener('click', () => setDemoMode('busy'));

  function toggleTheme() {
    const root = document.documentElement;
    const next = root.getAttribute('data-theme') === 'night' ? 'light' : 'night';
    if (next === 'night') root.setAttribute('data-theme', 'night');
    else root.removeAttribute('data-theme');
    const pressed = String(next === 'night');
    document.getElementById('theme-toggle').setAttribute('aria-pressed', pressed);
    document.getElementById('theme-toggle-mobile').setAttribute('aria-pressed', pressed);
    document.getElementById('theme-icon-swap').classList.toggle('swapped', next === 'night');
    document.getElementById('theme-icon-swap-mobile').classList.toggle('swapped', next === 'night');
    const label = next === 'night' ? '切换宣纸日间' : '切换墨夜主题';
    document.getElementById('theme-label').textContent = label;
    document.getElementById('theme-toggle-mobile').setAttribute('aria-label', label);
    document.getElementById('meta-theme-color').setAttribute('content', next === 'night' ? '#161716' : '#F4F1E8');
  }
  document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
  document.getElementById('theme-toggle-mobile').addEventListener('click', toggleTheme);

  document.getElementById('btn-open-search').addEventListener('click', () => {
    toast('将打开阅读搜索页（127.0.0.1:8765）');
  });

  document.addEventListener('click', (e) => {
    const closeBtn = e.target.closest('[data-close-dialog]');
    if (closeBtn) {
      const dlg = document.getElementById(closeBtn.dataset.closeDialog);
      if (dlg) dlg.close('');
      return;
    }

    const switchMode = e.target.closest('[data-switch-mode]');
    if (switchMode) { setDemoMode(switchMode.dataset.switchMode); return; }

    const subtab = e.target.closest('[data-subtab]');
    if (subtab) { location.hash = '#' + subtab.dataset.subtab; return; }

    const ledgerScope = e.target.closest('[data-ledger-scope]');
    if (ledgerScope) { STATE.ledgerScope = ledgerScope.dataset.ledgerScope; render(); return; }

    const pdfCardFilter = e.target.closest('[data-pdf-filter-card]');
    if (pdfCardFilter) {
      const val = pdfCardFilter.dataset.pdfFilterCard;
      STATE.pdfFilter = STATE.pdfFilter === val ? 'all' : val;
      render();
      return;
    }

    const logFilterBtn = e.target.closest('[data-log-filter]');
    if (logFilterBtn) { STATE.logFilter = logFilterBtn.dataset.logFilter; render(); return; }

    const selJob = e.target.closest('[data-select-job]');
    if (selJob) { STATE.selectedJobId = selJob.dataset.selectJob; STATE.focusDetail = true; render(); return; }

    const openPdf = e.target.closest('[data-open-pdf]');
    if (openPdf) {
      const row = LIVE_CORPUS.pdfs.find((p) => p.uid === openPdf.dataset.openPdf);
      if (!row) return;
      STATE.activePdfUid = row.uid;
      document.getElementById('pdf-dlg-book').textContent = row.title;
      document.getElementById('pdf-dlg-meta').textContent = `${row.uid} · ${fmt(row.pages)} 页`;
      document.getElementById('pdf-route-select').value = row.route;
      document.getElementById('pdf-dialog').showModal();
      return;
    }

    const openRetire = e.target.closest('[data-open-retire]');
    if (openRetire) {
      const uid = openRetire.dataset.openRetire;
      const title = openRetire.dataset.title || uid;
      STATE.activeRetireUid = uid;
      document.getElementById('retire-dlg-book').textContent = title;
      document.getElementById('retire-dir').textContent = uid;
      document.getElementById('retire-expected-uid').textContent = uid;
      document.getElementById('retire-confirm-uid').value = '';
      document.getElementById('retire-check').checked = false;
      document.getElementById('retire-dialog').showModal();
      return;
    }

    if (e.target.closest('#import-dropzone')) { document.getElementById('mock-file-input').click(); return; }

    if (e.target.closest('#btn-refresh-overview')) {
      const swap = document.getElementById('refresh-icon-swap');
      if (swap) { swap.classList.add('swapped'); setTimeout(() => swap.classList.remove('swapped'), 1400); }
      toast(`已于 ${timeFmt.format(new Date())} 刷新书库读数`);
      return;
    }

    if (e.target.closest('#btn-retire-demo-q')) { STATE.retireQ = 'B0511'; render(); return; }
    if (e.target.closest('#btn-pdf-filter-reset')) { STATE.pdfFilter = 'all'; render(); return; }

    const editBtn = e.target.closest('[data-ledger-edit]');
    if (editBtn) { STATE.ledgerEditing = editBtn.dataset.ledgerEdit; render(); return; }
    if (e.target.closest('[data-ledger-cancel]')) { STATE.ledgerEditing = null; render(); return; }

    const saveBtn = e.target.closest('[data-ledger-save]');
    if (saveBtn) {
      const row = LIVE_CORPUS.ledger.find((r) => r.uid === saveBtn.dataset.ledgerSave);
      if (row) {
        row.title = document.getElementById('edit-title').value.trim() || row.title;
        row.cat1 = document.getElementById('edit-cat1').value.trim() || row.cat1;
        row.cat2 = document.getElementById('edit-cat2').value.trim() || row.cat2;
        row.keep = document.getElementById('edit-keep').value;
        STATE.ledgerEditing = null;
        render();
        toast(`已保存 ${row.uid} 并自动同步书目`);
      }
      return;
    }

    const agreeBtn = e.target.closest('[data-ledger-agree]');
    if (agreeBtn) {
      const row = LIVE_CORPUS.ledger.find((r) => r.uid === agreeBtn.dataset.ledgerAgree);
      if (row) { row.pending = false; row.note = '已确认（页面复核）'; render(); toast(`已确认 ${row.uid} 分类`); }
      return;
    }

    if (e.target.closest('#ledger-pick-all')) {
      LIVE_CORPUS.ledger.filter((r) => r.pending).forEach((r) => STATE.ledgerPicked.add(r.uid));
      render();
      return;
    }

    if (e.target.closest('#ledger-confirm-batch')) {
      toast(`已批量确认 ${STATE.ledgerPicked.size} 本书目分类`);
      STATE.ledgerPicked.clear();
      render();
      return;
    }

    const resolveBtn = e.target.closest('[data-resolve-job]');
    if (resolveBtn) {
      BUSY_OVERLAY.awaitingJob.state = 'succeeded';
      render();
      toast('已人工收口：任务标为已完成');
      return;
    }

    if (e.target.closest('#btn-resolve-plan-review')) {
      BUSY_OVERLAY.plan[2].action = 'add';
      BUSY_OVERLAY.plan[2].note = '已人工确认 · 准备入库';
      render();
      toast('已将第 3 行动作标为新增');
      return;
    }

    const svcOpen = e.target.closest('[data-open-svc]');
    if (svcOpen) { toast(`打开 ${svcOpen.dataset.openSvc}（:${svcOpen.dataset.port}）`); return; }

    const advBtn = e.target.closest('[data-adv-op]');
    if (advBtn) { toast(`已排入低频任务：${advBtn.dataset.advOp}`); return; }

    const dlBtn = e.target.closest('[data-mock-dl]');
    if (dlBtn) { toast(`准备下载 ${dlBtn.dataset.mockDl}`); return; }

    if (e.target.closest('#btn-reconcile')) { toast('已复核并完成差量同步（0.6 秒）'); return; }
    if (e.target.closest('#btn-docs-run')) { toast('已扫描文档库：当前没有遗漏待转的文档'); return; }
    if (e.target.closest('#btn-manual-rescan')) { toast('扫描完成：当前没有新增手工正文'); return; }
    if (e.target.closest('#btn-pdf-run')) { toast(`已将 ${STATE.pdfPicked.size} 本 PDF 排入转写队列`); return; }
    if (e.target.closest('#btn-split-run')) { toast(`已将 ${STATE.splitPicked.size} 本电子书排入拆章队列`); return; }
    if (e.target.closest('#btn-expand-run')) { toast('已排入主题增强任务'); return; }
    if (e.target.closest('#btn-ledger-refresh')) { toast('已刷新全库台账'); return; }
    if (e.target.closest('#btn-inbox-refresh')) { toast('已刷新收件箱'); return; }
    if (e.target.closest('#btn-scan-inbox')) { toast('已重新生成入库核对清单'); return; }
    if (e.target.closest('#btn-plan-accept-all')) { toast('已套用全部建议分类'); return; }
    if (e.target.closest('#btn-plan-apply')) { toast('入库演示完成'); return; }
    if (e.target.closest('#btn-job-rerun')) { toast('已重新排入该任务'); return; }

    const inspectBtn = e.target.closest('[data-inspect-book]');
    if (inspectBtn) { toast(`${inspectBtn.dataset.inspectBook}：第 9 章标题疑似误拆`); return; }
    const acceptBtn = e.target.closest('[data-accept-book]');
    if (acceptBtn) { toast(`已受理 ${acceptBtn.dataset.acceptBook} 并触发增量同步`); }
  });

  document.addEventListener('keydown', (e) => {
    const tab = e.target.closest('[role="tab"]');
    if (!tab) return;
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const list = Array.from(tab.parentElement.querySelectorAll('[role="tab"]'));
    const idx = list.indexOf(tab);
    const next = list[(idx + (e.key === 'ArrowRight' ? 1 : -1) + list.length) % list.length];
    if (next) { e.preventDefault(); next.focus(); next.click(); }
  });

  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'ledger-q' || t.id === 'pdf-q' || t.id === 'retire-q') {
      const pos = t.selectionStart;
      if (t.id === 'ledger-q') STATE.ledgerQ = t.value;
      else if (t.id === 'pdf-q') STATE.pdfQ = t.value;
      else STATE.retireQ = t.value;
      render();
      const el = document.getElementById(t.id);
      if (el) { el.focus(); el.setSelectionRange(pos, pos); }
    }
  });

  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'pdf-disp-filter') { STATE.pdfFilter = t.value; render(); }
    else if (t.id === 'toggle-auto-embed') { STATE.autoEmbed = t.checked; toast(t.checked ? '已开启自动同步语义索引' : '已关闭自动同步语义索引'); }
    else if (t.dataset.ledgerPick) {
      if (t.checked) STATE.ledgerPicked.add(t.dataset.ledgerPick);
      else STATE.ledgerPicked.delete(t.dataset.ledgerPick);
      render();
    } else if (t.dataset.splitPick) {
      if (t.checked) STATE.splitPicked.add(t.dataset.splitPick);
      else STATE.splitPicked.delete(t.dataset.splitPick);
      render();
    } else if (t.dataset.pdfPick) {
      if (t.checked) STATE.pdfPicked.add(t.dataset.pdfPick);
      else STATE.pdfPicked.delete(t.dataset.pdfPick);
      render();
    }
  });

  document.addEventListener('dragover', (e) => { const dz = e.target.closest('#import-dropzone'); if (dz) { e.preventDefault(); dz.classList.add('over'); } });
  document.addEventListener('dragleave', (e) => { const dz = e.target.closest('#import-dropzone'); if (dz) dz.classList.remove('over'); });
  document.addEventListener('drop', (e) => {
    const dz = e.target.closest('#import-dropzone');
    if (dz) { e.preventDefault(); dz.classList.remove('over'); setDemoMode('busy'); }
  });

  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
