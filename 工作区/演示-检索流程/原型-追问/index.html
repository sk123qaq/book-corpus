<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>追问页 · 五个变体</title>
<style>
  :root {
    --paper: #f6f3ec;
    --card: #fffdf8;
    --ink: #1d1c1a;
    --muted: #6f6a60;
    --line: #d9d2c4;
    --line-soft: #e8e2d6;
    --red: #a63d2f;
    --serif: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", serif;
    --sans: "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13px;
    display: flex;
    flex-direction: column;
  }

  header {
    height: 42px;
    flex: 0 0 42px;
    display: flex;
    align-items: stretch;
    border-bottom: 1px solid var(--line);
    background: var(--card);
  }
  .label {
    display: flex;
    align-items: center;
    padding: 0 18px;
    font-family: var(--serif);
    letter-spacing: .18em;
    font-size: 13px;
    border-right: 1px solid var(--line);
    white-space: nowrap;
  }
  .label i { width: 6px; height: 6px; border-radius: 50%; background: var(--red); margin-right: 8px; }

  nav { display: flex; align-items: stretch; flex: 1; overflow-x: auto; }
  nav button {
    border: 0;
    border-right: 1px solid var(--line-soft);
    background: transparent;
    color: var(--muted);
    padding: 0 16px;
    font: inherit;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
  }
  nav button .n {
    font-family: var(--mono);
    font-size: 10px;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 0 4px;
    line-height: 15px;
  }
  nav button:hover { background: var(--paper); }
  nav button[aria-selected="true"] {
    color: var(--ink);
    background: var(--paper);
    box-shadow: inset 0 -2px 0 var(--red);
  }
  nav button[aria-selected="true"] .n { border-color: var(--red); color: var(--red); }

  main { flex: 1; position: relative; min-height: 0; }
  main > iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--paper); }

  .grid {
    height: 100%;
    overflow: auto;
    padding: 22px;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
    align-content: start;
  }
  .cell { min-width: 0; }
  .cell h2 {
    margin: 0 0 2px;
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 600;
  }
  .cell h2 .rec {
    font-family: var(--mono);
    font-style: normal;
    font-size: 10px;
    font-weight: 400;
    color: var(--red);
    border: 1px solid #dcc0b8;
    border-radius: 3px;
    padding: 0 4px;
    margin-left: 7px;
    vertical-align: 2px;
  }
  .cell p { margin: 0 0 8px; color: var(--muted); font-size: 11.5px; line-height: 1.5; }
  .cell .frame {
    display: block;
    border: 1px solid var(--line);
    background: #fff;
    overflow: hidden;
    border-radius: 4px;
    cursor: pointer;
  }
  .cell .frame:hover { border-color: var(--red); }
  .cell .frame img { display: block; width: 100%; height: auto; }
  .howto {
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 16px 18px;
    background: var(--card);
    color: var(--muted);
    font-size: 12px;
    line-height: 1.9;
  }
  .howto b { color: var(--ink); font-weight: 500; }

  footer {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 18px;
    padding: 6px 16px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 11px;
    background: var(--card);
  }
  #note { flex: 1 1 380px; }
  #note b { color: var(--ink); font-weight: 500; margin-right: 6px; }
  .disc { white-space: nowrap; }
  .keys { white-space: nowrap; }
  kbd {
    font-family: var(--mono);
    font-size: 10px;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 3px;
    padding: 0 3px;
  }

  @media (max-width: 1100px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .disc { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="label"><i></i>追问页 · 五版</div>
  <nav id="tabs" role="tablist" aria-label="变体">
    <button role="tab" data-v="overview" aria-selected="true"><span class="n">00</span>总览</button>
    <button role="tab" data-v="v1"><span class="n">01</span>对话流接管</button>
    <button role="tab" data-v="v2"><span class="n">02</span>三栏研究台</button>
    <button role="tab" data-v="v3"><span class="n">03</span>追问树</button>
    <button role="tab" data-v="v4"><span class="n">04</span>问题簿</button>
    <button role="tab" data-v="v5"><span class="n">05</span>翻页</button>
  </nav>
</header>

<main id="stage"></main>

<footer>
  <span id="note"><b>赌注</b>五种：管线让位给聊天、原文常驻、追问挂到段上、多轮当账记、一次只看一问。</span>
  <span class="disc">原型 · 引文真实，耗时与计数为示意 · 只有前端</span>
  <span class="keys"><kbd>1</kbd>–<kbd>5</kbd> 切变体 · <kbd>0</kbd> 总览</span>
</footer>

<script>
  const notes = {
    overview: ['赌注', '五种：管线让位给聊天、原文常驻、追问挂到段上、多轮当账记、一次只看一问。'],
    v1: ['01 对话流接管', '答完之后就该是对话。五阶段收成一条可展开的窄带，仍然在每一轮里。代价是管线不再显眼。'],
    v2: ['02 三栏研究台', '选依据，再追问。选中的那段成为下一问的落点；不选或再点一次取消，下一问就只有书范围。'],
    v3: ['03 追问树', '追问问的是某一段，不是第几轮。追问挂在被问的段落下面，长成一棵树。代价是不按时间读。'],
    v4: ['04 问题簿', '多轮要能查账。一条一轮，带编号与读数，最新一轮内嵌五阶段。代价是像登记簿，不像聊天。'],
    v5: ['05 翻页', '一次只看一问。追问只多一页，五阶段完整保留，历史靠翻页与面包屑。代价是不能并排比两轮。']
  };
  const files = { v1: 'v1-chat.html', v2: 'v2-split.html', v3: 'v3-tree.html', v4: 'v4-ledger.html', v5: 'v5-turn.html' };
  const meta = {
    v1: ['01 对话流接管', '答完之后，这个页面变成对话。'],
    v2: ['02 三栏研究台', '选一段依据，下一问就挂在它上面。'],
    v3: ['03 追问树', '追问挂在被问的那一段上。'],
    v4: ['04 问题簿', '一条一轮，编号、读数、可回查。'],
    v5: ['05 翻页', '原页面不动，历史变成翻页。']
  };

  const stage = document.getElementById('stage');
  const tabs = [...document.querySelectorAll('#tabs button')];
  const noteEl = document.getElementById('note');
  const order = ['overview', 'v1', 'v2', 'v3', 'v4', 'v5'];

  function overview() {
    const grid = document.createElement('div');
    grid.className = 'grid';
    for (const v of order.filter(k => k !== 'overview')) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.innerHTML = `<h2>${meta[v][0]}${v === 'v2' ? '<span class="rec">推荐</span>' : ''}</h2><p>${meta[v][1]}</p>
        <a class="frame" data-v="${v}" href="${files[v]}"><img src="shots/${v}-1440.png" alt="${meta[v][0]}"></a>`;
      grid.appendChild(cell);
    }
    const how = document.createElement('div');
    how.className = 'cell';
    how.innerHTML = `<h2>怎么比</h2><p>同一份三回合内容，同一套纸感 token，只换结构。</p>
      <div class="howto">
        <b>第一眼</b>追问入口在哪，要不要猜。<br>
        <b>第二眼</b>上一轮的五阶段去哪了。<br>
        <b>第三眼</b>两轮之间是流、栏、树、账，还是页。<br>
        <span style="font-family:var(--mono);font-size:11px">点缩略图进实页，<kbd>1</kbd>–<kbd>5</kbd> 直接切。</span>
      </div>`;
    grid.appendChild(how);
    stage.replaceChildren(grid);
    grid.querySelectorAll('.frame').forEach(f => f.addEventListener('click', e => {
      e.preventDefault();
      show(f.dataset.v);
    }));
  }

  function show(v) {
    tabs.forEach(t => t.setAttribute('aria-selected', String(t.dataset.v === v)));
    history.replaceState(null, '', '#' + v);
    noteEl.innerHTML = `<b>${notes[v][0]}</b>${notes[v][1]}`;
    if (v === 'overview') { overview(); return; }
    stage.innerHTML = `<iframe src="${files[v]}" title="${notes[v][1]}"></iframe>`;
  }

  function current() {
    return (tabs.find(t => t.getAttribute('aria-selected') === 'true') || tabs[0]).dataset.v;
  }

  tabs.forEach(t => t.addEventListener('click', () => show(t.dataset.v)));
  addEventListener('keydown', e => {
    if (e.target.matches('input, textarea')) return;
    const i = order.indexOf(current());
    if (e.key >= '0' && e.key <= '5') {
      const v = order[Number(e.key)];
      if (v) show(v);
    } else if (e.key === 'ArrowRight') {
      show(order[(i + 1) % order.length]);
    } else if (e.key === 'ArrowLeft') {
      show(order[(i - 1 + order.length) % order.length]);
    }
  });

  overview();
  const first = location.hash.slice(1);
  if (order.includes(first) && first !== 'overview') show(first);
</script>
</body>
</html>
