<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v2 · 三栏研究台</title>
<link rel="stylesheet" href="shared/tokens.css">
<style>
  html { height: 100%; }
  body { min-height: 100vh; display: flex; flex-direction: column; }

  .masthead { max-width: 1400px; padding: 13px 24px; }

  /* ---- 三栏骨架 ------------------------------------------------- */
  .app {
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 24px;
    display: grid;
    --gutter: 28px;
    grid-template-areas: "rail" "main" "drawer" "ask";
  }
  .rail   { grid-area: rail; }
  .main   { grid-area: main; }
  .drawer { grid-area: drawer; }
  .ask    { grid-area: ask; }
  .rail, .main, .drawer, .ask { min-width: 0; }

  @media (min-width: 1320px) {
    body { height: 100vh; }
    .app {
      flex: 1;
      min-height: 0;
      grid-template-columns: 300px minmax(520px, 1fr) 380px;
      grid-template-rows: minmax(0, 1fr) auto;
      grid-template-areas: "rail main drawer" "rail ask drawer";
    }
  }

  /* ---- 左：会话线索 --------------------------------------------- */
  .rail {
    display: flex;
    flex-direction: column;
    padding: 18px 18px 14px;
    border-right: 1px solid var(--line);
    min-height: 0;
    overflow-y: auto;
  }
  .rail-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  .rail-head .mono { font-size: 11px; letter-spacing: .1em; color: var(--muted); }
  .rail-head b { font-size: 12px; font-weight: 500; color: var(--ink); }

  .rounds { list-style: none; margin: 0; padding: 0; }
  .round {
    position: relative;
    padding: 12px 0 12px 13px;
    border-bottom: 1px solid var(--line-soft);
  }
  .round .no {
    display: block;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .08em;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .round .q {
    margin: 0 0 8px;
    font-family: var(--serif);
    font-size: 14px;
    line-height: 1.62;
    color: var(--muted);
  }
  .round .meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .round .meta .chip { font-size: 10.5px; padding: 0 7px; color: var(--muted); }
  .round .ids { display: inline-flex; gap: 3px; font-family: var(--mono); font-size: 10px; color: #a9a294; }
  .round .ids i { font-style: normal; }
  .round .ids .on { color: var(--red-ink); background: var(--red-soft); border-radius: 3px; padding: 0 2px; }

  .round.is-current { background: var(--soft); box-shadow: inset 0 0 0 1px var(--line-soft); border-radius: 2px; }
  .round.is-current::before {
    content: "";
    position: absolute;
    left: 0; top: 10px; bottom: 10px;
    width: 3px;
    background: var(--red);
    border-radius: 2px;
  }
  .round.is-current .q { color: var(--ink); }
  .round.is-current .no { color: var(--red-ink); }
  .round.is-pending { border-bottom: 0; }
  .round.is-pending .q { color: #9a9384; font-size: 13.5px; }
  .p-caret {
    display: inline-block;
    width: 2px; height: 13px;
    margin-left: 3px;
    vertical-align: -2px;
    background: var(--red);
    animation: caret 1.06s steps(1, end) infinite;
  }

  .rail-foot {
    margin-top: auto;
    padding-top: 14px;
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--muted);
  }
  .rail-foot .plus { font-family: var(--mono); font-size: 13px; color: var(--red-ink); }

  /* ---- 中：当前轮 ------------------------------------------------ */
  .main {
    min-width: 0;
    min-height: 0;
    overflow-y: auto;
    padding: 20px var(--gutter) 22px;
  }
  .kicker {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .kicker .no {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .1em;
    color: var(--ink);
  }
  .kicker .chip { font-size: 10.5px; padding: 0 7px; color: var(--red-ink); border-color: #e2cfc7; background: var(--red-soft); }
  .kicker .read {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
    white-space: nowrap;
  }

  .question {
    margin: 9px 0 18px;
    font-family: var(--serif);
    font-size: 29px;
    line-height: 1.42;
    font-weight: 500;
    letter-spacing: .01em;
  }

  /* 五阶段窄条 */
  .strip {
    border: 1px solid var(--line-soft);
    background: var(--soft);
    border-radius: 8px;
    overflow: hidden;
  }
  .strip-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 9px 12px;
    border: 0;
    background: transparent;
    text-align: left;
  }
  .steps { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
  .step { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .step .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--line); }
  .step:last-child .dot { background: var(--red); }
  .step .sn { font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .step .sname { font-size: 11px; color: var(--ink); letter-spacing: .01em; }
  .strip-toggle {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .strip .when-open { display: none; }
  .strip.is-open .when-open { display: inline; }
  .strip.is-open .when-closed { display: none; }

  .cells {
    display: none;
    grid-template-columns: repeat(5, 1fr);
    border-top: 1px solid var(--line-soft);
    padding: 10px 12px 11px;
  }
  .strip.is-open .cells { display: grid; }
  .cell { padding-left: 10px; border-left: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 2px; }
  .cell:first-child { padding-left: 0; border-left: 0; }
  .cell .cn { font-family: var(--mono); font-size: 9.5px; color: var(--muted); }
  .cell .cname { font-size: 10.5px; color: var(--ink); }
  .cell .cval { font-family: var(--mono); font-size: 10px; color: var(--muted); }

  /* 追问落点 */
  .anchor { position: relative; margin-top: 16px; }
  .anchor::after {
    content: "";
    position: absolute;
    right: calc(-1 * var(--gutter));
    top: 15px;
    width: calc(var(--gutter) + 6px);
    height: 9px;
    background: var(--red);
    clip-path: polygon(0 3px, calc(100% - 7px) 3px, 100% 50%, calc(100% - 7px) 6px, 0 6px);
  }
  .anchor-hit {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--line-soft);
    background: var(--card);
    border-radius: 8px;
    text-align: left;
  }
  .anchor-hit:hover { border-color: var(--line); }
  .anchor-hit .lbl {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: .06em;
    white-space: nowrap;
  }
  .anchor-hit .quote {
    font-family: var(--serif);
    font-size: 15px;
    color: var(--ink);
    white-space: nowrap;
  }
  .anchor-hit .src {
    margin-left: auto;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  .answer { margin-top: 22px; font-family: var(--serif); font-size: 20px; line-height: 2.02; }
  .answer p { margin: 0 0 22px; }
  .answer p:last-child { margin-bottom: 0; }
  .cite { border: 0; cursor: pointer; }
  .tail { white-space: nowrap; }
  .cite:hover { background: var(--red-ink); color: #fff; }
  .cite.is-on { background: var(--red); color: #fff; }

  /* 本轮依据 */
  .evidences { margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--line-soft); }
  .ev-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .ev-head .t { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; color: var(--muted); }
  .ev-head .h { font-size: 11px; color: var(--muted); }
  .ev {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    gap: 10px;
    align-items: start;
    width: 100%;
    padding: 11px 10px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    text-align: left;
  }
  .ev:hover { background: var(--card); border-color: var(--line-soft); }
  .ev.is-on { background: var(--card); border-color: var(--line-soft); }
  .ev .ev-src { display: block; font-size: 10.5px; color: var(--muted); margin-bottom: 2px; }
  .ev .ev-quote { display: block; font-family: var(--serif); font-size: 14px; line-height: 1.75; color: var(--ink); }
  .ev .ev-go { font-family: var(--mono); font-size: 10px; color: var(--muted); padding-top: 2px; white-space: nowrap; }
  .ev:hover .ev-go { color: var(--red-ink); }

  /* ---- 中栏底部：接着问 ------------------------------------------ */
  .ask {
    border-top: 1px solid var(--line);
    padding: 12px var(--gutter) 14px;
    min-width: 0;
  }
  .ask-sugs { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 9px; }
  .ask-sugs .lbl { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; color: var(--muted); margin-right: 2px; }
  .ask-sugs .chip { font-size: 11.5px; padding: 2px 9px; }
  .ask-sugs .chip:hover { border-color: var(--red); color: var(--red-ink); }
  .ask-row { display: flex; gap: 8px; align-items: stretch; }
  .ask-field { position: relative; flex: 1; min-width: 0; }
  .ask-field .field { padding: 10px 13px; }
  .ask-field .caret {
    position: absolute;
    left: 15px; top: 12px;
    width: 2px; height: 19px;
    background: var(--red);
    animation: caret 1.06s steps(1, end) infinite;
  }
  .ask-field.has-text .caret { display: none; }
  .ask-field input { caret-color: transparent; }
  @keyframes caret { 0%, 82% { opacity: 1; } 83%, 100% { opacity: 0; } }
  .ask-send { padding: 0 20px; font-size: 13.5px; }
  .ask-hint { display: flex; justify-content: flex-end; margin-top: 6px; font-family: var(--mono); font-size: 10px; color: #9a9384; }

  /* ---- 右：证据抽屉 ---------------------------------------------- */
  .drawer {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-left: 1px solid var(--line);
  }
  .drawer .when-open { display: none; }
  .drawer.is-open .when-open { display: inline; }
  .drawer.is-open .when-closed { display: none; }
  .drawer-toggle {
    display: none;
    position: absolute;
    top: 14px; right: 16px;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 999px;
    padding: 1px 9px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    z-index: 2;
  }
  .panel { display: none; flex-direction: column; min-height: 0; flex: 1; }
  .panel.is-shown { display: flex; }

  .drawer-head {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--line-soft);
  }
  .dh-top { display: flex; align-items: center; gap: 9px; }
  .dh-top .cite { font-size: 11px; padding: 1px 6px; }
  .dh-top .book { font-family: var(--serif); font-size: 15px; }
  .dh-sub { margin: 3px 0 0 0; font-size: 11.5px; color: var(--muted); }

  .drawer-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 20px 4px; }
  .src-label { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
  .ctx-label { margin-top: 18px; }
  .ctx {
    font-family: var(--serif);
    font-size: 13px;
    line-height: 1.9;
    color: #8a8478;
    margin: 0 0 10px;
  }
  .ctx .who { font-family: var(--mono); font-size: 9.5px; color: #a9a294; display: block; margin-bottom: 1px; }
  .current {
    font-family: var(--serif);
    font-size: 15.5px;
    line-height: 1.95;
    margin: 0 0 12px;
    padding-left: 11px;
    border-left: 2px solid var(--red);
  }
  .current mark {
    background: var(--red-soft);
    color: var(--red-ink);
    padding: 1px 2px;
    border-radius: 2px;
  }
  .hop { display: flex; gap: 6px; margin: 14px 0 0; }
  .hop button { text-align: center; }
  .hop button {
    flex: 1;
    border: 1px solid var(--line-soft);
    background: transparent;
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 10.5px;
    color: var(--muted);
    text-align: left;
  }
  .hop button:hover { border-color: var(--line); color: var(--ink); }

  .drawer-foot {
    border-top: 1px solid var(--line);
    padding: 11px 20px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .drawer-foot .path {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .drawer-foot .btn { font-size: 12px; padding: 5px 10px; white-space: nowrap; }

  /* ---- 窄屏 ------------------------------------------------------ */
  @media (max-width: 1319px) {
    .app { padding: 0 16px; grid-template-columns: minmax(0, 1fr); }
    .rail { border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 0 10px; overflow: visible; }
    .rail-head { padding-bottom: 8px; margin-bottom: 10px; }
    .rounds { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 2px; min-width: 0; }
    .round {
      flex: 0 0 232px;
      scroll-snap-align: start;
      padding: 9px 11px 9px 13px;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      background: var(--card);
    }
    .round.is-pending { display: none; }
    .rail-foot { display: none; }
    .main { overflow: visible; padding: 14px 0 0; }
    .question { font-size: 20px; margin: 8px 0 13px; }
    .kicker .read { font-size: 10px; }
    .steps { gap: 0; display: grid; grid-template-columns: repeat(5, 1fr); }
    .step { flex-direction: column; align-items: flex-start; gap: 1px; padding-left: 8px; border-left: 1px solid var(--line-soft); }
    .step:first-child { padding-left: 0; border-left: 0; }
    .step .sname { font-size: 9.5px; }
    .step .dot { display: none; }
    .cells { padding: 8px 12px 9px; }
    .anchor::after { display: none; }
    .anchor-hit { flex-wrap: wrap; gap: 6px; }
    .anchor-hit .src { margin-left: 0; width: 100%; }
    .answer { font-size: 16px; line-height: 1.9; margin-top: 16px; }
    .answer p { margin-bottom: 15px; }
    .evidences { display: none; }
    .ask { border-top: 1px solid var(--line); padding: 9px 0 36px; }
    .ask-hint { display: none; }
    .ask-sugs { margin-bottom: 7px; }
    .ask-sugs .chip { font-size: 11px; }

    .drawer { border-left: 0; border-top: 1px solid var(--line); }
    .drawer-toggle { display: block; }
    .drawer-head { padding: 11px 16px 4px; border-bottom: 0; }
    .dh-top { gap: 7px; }
    .dh-top .book { font-size: 13.5px; }
    .dh-sub { margin-top: 1px; font-size: 10.5px; }
    .drawer-body { padding: 0 16px 10px; overflow: visible; }
    .drawer-body .src-label, .drawer-body .ctx, .drawer-body .hop { display: none; }
    .current {
      font-size: 12.5px;
      line-height: 1.85;
      margin: 0;
      padding-left: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .drawer-foot { display: none; }
    .drawer.is-open .current { display: block; }
    .drawer.is-open .drawer-body .src-label,
    .drawer.is-open .drawer-body .ctx { display: block; }
    .drawer.is-open .drawer-body { padding-bottom: 12px; }
    .drawer.is-open .drawer-foot { display: flex; padding: 10px 16px 14px; }
    .drawer.is-open .dh-sub { margin-bottom: 2px; }
  }

  @media (max-width: 700px) {
    .masthead { padding: 11px 16px; }
    .brand { font-size: 13px; letter-spacing: .16em; }
    .stats { gap: 11px; font-size: 11px; }
    .stats b { font-size: 11.5px; }
  }

  /* 手机：把一屏压到 844 内，输入框必须留在首屏能看到的位置 */
  @media (max-width: 560px) {
    .rail { padding: 9px 0 7px; }
    .rail-head { padding-bottom: 5px; margin-bottom: 7px; }
    .rail-head .mono { font-size: 10px; }
    .round { padding: 8px 10px 7px 12px; }
    .round .no { font-size: 9.5px; margin-bottom: 2px; }
    .round .q { font-size: 13px; line-height: 1.5; margin-bottom: 6px; }
    .round .meta .chip { font-size: 10px; padding: 0 6px; }
    .question { font-size: 19px; margin: 7px 0 12px; }
    .strip-bar { padding: 7px 10px; }
    .step .sn, .step .sname { font-size: 9px; }
    .anchor { margin-top: 12px; }
    .anchor-hit { padding: 7px 10px; gap: 6px; }
    .anchor-hit .lbl { font-size: 9px; }
    .anchor-hit .quote { font-size: 13.5px; }
    .anchor-hit .src { font-size: 10px; }
    .answer { font-size: 14px; line-height: 1.82; margin-top: 12px; }
    .answer p { margin-bottom: 12px; }
    .drawer-head { padding: 9px 16px 3px; }
    .dh-top .book { font-size: 13px; }
    .dh-sub { font-size: 10px; }
    .drawer-body { padding: 0 16px 9px; }
    .current { font-size: 12px; line-height: 1.75; }
    .drawer-toggle { font-size: 9.5px; top: 11px; right: 14px; }
    .ask { padding: 8px 0 32px; }
    .ask-sugs { margin-bottom: 5px; }
    .ask-sugs .chip { font-size: 10.5px; padding: 1px 8px; }
    .ask-field .field { font-size: 14px; padding: 9px 12px; }
    .ask-field .caret { left: 14px; top: 11px; height: 17px; }
    .ask-send { font-size: 12.5px; padding: 0 16px; }
  }
  /* ---- 会话线索：一条线串起三问 -------------------------------- */
  .rounds { position: relative; }
  .rounds::before {
    content: "";
    position: absolute;
    left: 3px; top: 18px; bottom: 18px;
    width: 1px;
    background: var(--line);
  }
  .round { padding-left: 18px; }
  .round::before {
    content: "";
    position: absolute;
    left: 0; top: 24px; bottom: auto;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--paper);
    border: 1px solid var(--line);
  }
  .round.is-current::before { background: var(--red); border-color: var(--red); }
  .round.is-current::after {
    content: "";
    position: absolute;
    left: 0; top: 10px; bottom: 10px;
    width: 3px;
    background: var(--red);
    border-radius: 2px;
  }
  .round .rel {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
    margin: 0 0 7px;
    font-size: 10.5px;
    line-height: 1.5;
    color: var(--muted);
  }
  .round .rel .from { color: #9a9384; white-space: nowrap; }
  .round .rel .qt { max-width: 100%; white-space: normal; }
  .round .rel .cite { font-size: 9.5px; padding: 0 3px; }
  .round .rel.none .from { color: #a9a294; }

  /* ---- 落点 / 范围 ---------------------------------------------- */
  .scope-row {
    display: flex;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
    margin-top: 16px;
    padding: 8px 12px;
    border: 1px dashed var(--line);
    border-radius: 8px;
  }
  .scope-row .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; color: var(--muted); }
  .scope-row .quote { font-family: var(--serif); font-size: 15px; }
  .scope-row .src { margin-left: auto; font-size: 11px; color: var(--muted); }
  .kicker .chip.scope { color: var(--muted); border-color: var(--line); background: var(--paper); }
  .anchor-hit { cursor: pointer; }
  .anchor-hit .cite { border: 0; }

  /* ---- 抽屉：落点标记与提示 -------------------------------------- */
  .dh-top .pin {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--red-ink);
    background: var(--red-soft);
    border: 1px solid #e2cfc7;
    border-radius: 3px;
    padding: 0 4px;
    line-height: 1.6;
  }
  .pick-hint {
    display: block;
    margin: 5px 0 0;
    padding: 0;
    border: 0;
    background: none;
    font-size: 10.5px;
    color: #9a9384;
    text-align: left;
  }
  .pick-hint[data-x] { color: var(--red-ink); cursor: pointer; }
  .current[data-cite] { cursor: pointer; }

  /* ---- composer 的落点状态 -------------------------------------- */
  .ask-hint { margin: 0 0 8px; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

    const c = e.target.closest('[data-cite]');
    if (c) { onCite(+c.dataset.cite); return; }
    if (e.target.closest('[data-x]')) { sel = null; renderAll(); return; }
    const bar = e.target.closest('.strip-bar');
    if (bar) {
      const strip = bar.closest('.strip');
      strip.classList.toggle('is-open');
      bar.setAttribute('aria-expanded', String(strip.classList.contains('is-open')));
      return;
    }
    const round = e.target.closest('[data-turn]');
    if (round) showTurn(+round.dataset.turn);
  });

  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.anchor-hit[data-cite]')) {
      e.preventDefault();
      onCite(+e.target.dataset.cite);
    }
  });

  document.querySelector('.drawer-toggle').addEventListener('click', () => {
    document.querySelector('.drawer').classList.toggle('is-open');
  });

  field.addEventListener('input', () => field.closest('.ask-field').classList.toggle('has-text', field.value !== ''));

  renderAll();
</script>

</body>
</html>
