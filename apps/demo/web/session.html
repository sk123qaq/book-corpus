<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会话追问 · 书库检索</title>
<link rel="stylesheet" href="/session.css">
</head>
<body>
<header class="masthead">
  <a class="brand" href="/">书库检索<span class="brand-dot"></span></a>
  <div class="stats" id="stats" aria-label="书库规模">
    <span><b class="mono" data-stat="books">—</b> 本</span>
    <span><b class="mono" data-stat="paras">—</b> 段</span>
    <span><b class="mono" data-stat="chapters">—</b> 章</span>
  </div>
  <nav class="nav"><a href="/classic">完整流程 ↗</a></nav>
</header>

<main class="app">
  <aside class="rail" aria-label="会话">
    <div class="rail-tabs" role="tablist" aria-label="会话视图">
      <button class="rail-tab" id="tab-current" type="button" role="tab"
              aria-selected="false" aria-controls="panel-current">本次会话 <b id="turn-count">0</b></button>
      <button class="rail-tab is-on" id="tab-history" type="button" role="tab"
              aria-selected="true" aria-controls="panel-history">历史会话 <b id="history-count">0</b></button>
    </div>
    <div class="rail-panels">
      <section class="rail-panel" id="panel-current" role="tabpanel"
               aria-labelledby="tab-current" hidden>
        <p class="rail-sub" id="rail-sub">还没有开始</p>
        <div class="rail-scroll">
          <div class="rail-empty" id="rail-empty">
            <p>还没有开始。</p>
            <p>问一句，本次会话的线索会出现在这里。</p>
          </div>
          <ol class="rounds" id="rounds"></ol>
        </div>
        <button class="rail-foot" type="button" id="new-session"><span class="plus">+</span>新会话</button>
      </section>
      <section class="rail-panel" id="panel-history" role="tabpanel"
               aria-labelledby="tab-history">
        <div class="hist-search">
          <span class="mag" aria-hidden="true">⌕</span>
          <input id="hist-filter" type="text" autocomplete="off"
                 placeholder="搜问题或书名" aria-label="搜索历史会话">
        </div>
        <div class="hist-tools" id="hist-tools">
          <label class="hist-all"><input type="checkbox" id="hist-all"><span>全选</span></label>
          <span class="hist-picked" id="hist-picked">已选 0</span>
          <button class="hist-del" type="button" id="hist-delete" disabled>删除选中</button>
        </div>
        <div class="rail-scroll hist-scroll" id="hist-list"></div>
        <p class="hist-note">切换只是换视图：正在跑的回答会在后台继续，可回来查看。</p>
      </section>
    </div>
  </aside>

  <section class="main" id="main"></section>

  <div class="ask">
    <div class="ask-hint" id="hint"></div>
    <div class="ask-row">
      <div class="ask-field" id="ask-field">
        <input class="field" id="q" type="text" maxlength="300" autocomplete="off"
               aria-label="接着问" placeholder="问一句，从书里找原文">
        <span class="caret" aria-hidden="true"></span>
      </div>
      <button class="btn btn-primary ask-send" type="button" id="send">追问</button>
    </div>
  </div>

  <aside class="drawer" id="drawer">
    <button class="drawer-toggle" type="button" id="drawer-toggle">
      <span class="when-closed">原文</span><span class="when-open">收起</span>
    </button>
    <section class="panel is-shown" id="panel"></section>
  </aside>
</main>

<div class="toast" id="toast" hidden></div>
<script src="/session.js"></script>
</body>
</html>
