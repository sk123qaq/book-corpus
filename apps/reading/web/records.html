<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" id="meta-theme-color" content="#F4F1E8">
<script>(function(){try{var r=document.documentElement,sp=new URLSearchParams(location.search),q=sp.get("theme"),n=localStorage.getItem("reading-night")==="1",t=localStorage.getItem("reading-theme");if(q==="cold"||q==="warm"){t=q;n=false;}if(n){r.setAttribute("data-theme","night");r.dataset.bootNight="1";}else if(t==="cold"){r.classList.add("cold");r.setAttribute("data-theme","cold");}else{r.setAttribute("data-theme","warm");}}catch(e){}})();</script>
<title>伴读 · 操作日志</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/pages.css">
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body>
<a class="skip-link" href="#main-content">跳至主要内容</a>
<header class="topbar" id="topbar">
  <div class="top-left">
    <a class="brand" href="/"><span class="brand-seal" aria-hidden="true">伴</span><span class="brand-name" translate="no">伴读</span></a>
  </div>
  <div class="top-right">
    <label class="top-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
      <input id="top-q" type="search" autocomplete="off" placeholder="搜书名、作者或章名…" aria-label="快速搜索书目">
      <span class="kbd" aria-hidden="true">/</span>
    </label>
    <nav class="main-nav" aria-label="伴读主导航">
      <a class="nav-tab" href="/">书架</a>
      <a class="nav-tab" href="/catalog">书目</a>
      <a class="nav-tab" href="/records" aria-current="page">日志</a>
    </nav>
    <div class="theme-seg" role="group" aria-label="纸色主题">
      <button type="button" data-theme-choice="warm" aria-pressed="true">暖纸</button>
      <button type="button" data-theme-choice="cold" data-theme-toggle aria-pressed="false">冷纸</button>
      <button type="button" id="night" data-theme-choice="night" aria-pressed="false" aria-label="切换夜读" title="夜读模式">夜读</button>
    </div>
  </div>
</header>

<main class="page" id="main-content">
  <div class="page-head">
    <div class="eyebrow mono">append-only · 工作区/阅读/ops_log.jsonl</div>
    <h1>章节伴读操作日志</h1>
    <p class="lede">记录你在各章使用知识地图、划词图解、讲人话举例、翻译原意、拆前提、追问与旁批钉住的每次操作，点击即可跳回对应正文段落。</p>
    <div class="stats" id="stats"></div>
  </div>

  <section class="recs">
    <div class="section-head">
      <div><div class="eyebrow">按章汇总</div><h2>有伴读足迹的章节</h2></div>
      <span class="count" id="chapter-count"></span>
    </div>
    <div id="chapters"><div class="empty">正在读取日志…</div></div>
  </section>

  <section class="recs">
    <div class="section-head">
      <div><div class="eyebrow">操作流水</div><h2>近期功能记录</h2></div>
      <div class="rec-tabs" id="tabs"></div>
    </div>
    <div class="ops-toolbar">
      <input class="ops-search" id="ops-q" type="search" placeholder="按书名、章名、UID 或摘要过滤…" aria-label="过滤操作日志">
      <button type="button" class="wb-btn" id="btn-refresh">刷新</button>
      <span class="wb-sub" id="shown"></span>
    </div>
    <div id="records"><div class="empty">正在读取日志…</div></div>
  </section>
</main>

<script src="/assets/app.js"></script>
<script src="/assets/common.js"></script>
<script src="/assets/theme.js"></script>
<script>
const TABS = [
  { key: 'all', name: '全部', match: () => true },
  { key: 'chapter_map', name: '知识地图', match: (x) => x.action === 'chapter_map' },
  { key: 'assist', name: '划词伴读', match: (x) => ['diagram', 'explain', 'translate', 'critique', 'ask'].includes(x.action) },
  { key: 'pin', name: '旁批变更', match: (x) => ['pin', 'unpin'].includes(x.action) },
  { key: 'error', name: '失败', match: (x) => x.status === 'error' },
];
let data = { logs: [], chapters: [], summary: {} };
let filter = 'all';

RD.ready(async () => {
  RD.night();
  const initialUid = new URLSearchParams(location.search).get('uid') || '';
  if (initialUid && RD.mount('ops-q')) RD.mount('ops-q').value = initialUid;
  await load();
  RD.mount('ops-q').addEventListener('input', renderAll);
  RD.mount('btn-refresh').addEventListener('click', load);
});

async function load() {
  try {
    data = await RD.api('/api/records');
  } catch (err) {
    RD.fail(RD.mount('records'), err.message);
    return;
  }
  renderAll();
}

function formatTs(ts) {
  if (!ts) return '—';
  return String(ts).replace('T', ' ').replace(/[+-]\d{2}:\d{2}$/, '');
}

function renderAll() {
  const s = data.summary || {};
  RD.mount('stats').innerHTML =
    '<span><b>' + RD.fmt(s.total || 0) + '</b>条日志</span>' +
    '<span><b>' + RD.fmt(s.chapters || 0) + '</b>章留痕</span>' +
    '<span><b>' + RD.fmt(s.assist || 0) + '</b>次划词伴读</span>' +
    '<span><b>' + RD.fmt(s.chapter_map || 0) + '</b>张导图</span>' +
    '<span><b>' + RD.fmt(s.pin || 0) + '</b>次旁批变更</span>' +
    '<span><b>' + RD.fmt(s.error || 0) + '</b>失败</span>';

  renderChapters();
  renderTabs();
  renderLogs();
}

function renderChapters() {
  const list = data.chapters || [];
  RD.mount('chapter-count').textContent = list.length ? list.length + ' 章' : '';
  const mount = RD.mount('chapters');
  if (!list.length) {
    mount.innerHTML = '<div class="empty">还没有功能操作记录。先从<a href="/">书架</a>翻开一章阅读吧。</div>';
    return;
  }
  mount.innerHTML = '<div class="data-card"><div class="data-table-wrap"><table class="ops-table ops-chapters-table"><thead><tr><th>章节</th><th>书名</th><th>产物</th><th>功能足迹</th><th>最近操作</th><th class="ops-go-head"></th></tr></thead><tbody>' +
    list.map((ch) => {
      const badges = [];
      if (ch.has_map) badges.push('导图');
      if (ch.note_count) badges.push(ch.note_count + ' 旁批');
      return '<tr>' +
        '<td><b>' + RD.esc(ch.uid) + '-' + RD.esc(ch.n) + '</b> · ' + RD.esc(ch.chapter_title) + '</td>' +
        '<td>' + RD.esc(ch.book_title) + '</td>' +
        '<td>' + (badges.length ? badges.map((b) => '<span class="ops-badge ok">' + RD.esc(b) + '</span>').join(' ') : '<span class="wb-sub">仅日志</span>') + '</td>' +
        '<td>' + (ch.actions || []).map((a) => RD.esc(RD.actionNames[a] || a)).join(' · ') + '（' + RD.fmt(ch.ops) + '）</td>' +
        '<td class="ops-ts">' + RD.esc(formatTs(ch.last_ts)) + '</td>' +
        '<td class="ops-go-cell"><a class="wb-btn ops-go" href="' + RD.chapterHref(ch.uid, ch.n) + '">翻开 →</a></td>' +
      '</tr>';
    }).join('') + '</tbody></table></div></div>';
}

function renderTabs() {
  const logs = data.logs || [];
  RD.mount('tabs').innerHTML = TABS.map((tab) => {
    const count = logs.filter(tab.match).length;
    return '<button type="button" data-filter="' + tab.key + '" aria-pressed="' + (filter === tab.key) + '">' +
      RD.esc(tab.name) + '<span class="count">' + RD.fmt(count) + '</span></button>';
  }).join('');
  RD.mount('tabs').onclick = (e) => {
    const btn = e.target.closest('button[data-filter]');
    if (!btn) return;
    filter = btn.dataset.filter;
    renderTabs();
    renderLogs();
  };
}

function renderLogs() {
  const q = ((RD.mount('ops-q') && RD.mount('ops-q').value) || '').trim().toLowerCase();
  const tab = TABS.find((t) => t.key === filter) || TABS[0];
  const rows = (data.logs || []).filter((item) => {
    if (!tab.match(item)) return false;
    if (!q) return true;
    const hay = [item.uid, item.n, item.book_title, item.chapter_title, item.summary, item.error, item.action].join(' ').toLowerCase();
    return hay.includes(q);
  });
  RD.mount('shown').textContent = '显示 ' + RD.fmt(rows.length) + ' 条';
  const mount = RD.mount('records');
  if (!rows.length) {
    mount.innerHTML = '<div class="empty">当前筛选下没有操作日志。</div>';
    return;
  }
  mount.innerHTML = '<div class="data-card"><div class="data-table-wrap"><table class="ops-table ops-logs-table"><thead><tr><th>时间</th><th>章节</th><th>功能</th><th>段落</th><th>结果 / 用量</th><th>摘要</th><th class="ops-go-head"></th></tr></thead><tbody>' +
    rows.map((item) => {
      const blocks = (item.block_ids || []).join(', ');
      const firstBlk = (item.block_ids || [])[0] || '';
      const ok = item.status !== 'error';
      const usageParts = [];
      if (item.tokens) usageParts.push(RD.fmt(item.tokens) + ' tok');
      if (item.elapsed_ms) usageParts.push(RD.elapsed(item.elapsed_ms));
      return '<tr>' +
        '<td class="ops-ts">' + RD.esc(formatTs(item.ts)) + '</td>' +
        '<td class="ops-ch-cell"><a class="ops-ch-link" href="' + RD.chapterHref(item.uid, item.n, firstBlk) + '"><b>' + RD.esc(item.uid) + '-' + RD.esc(item.n) + '</b> ' +
          RD.esc(item.chapter_title || '') + '</a><div class="wb-sub">' + RD.esc(item.book_title || '') + '</div></td>' +
        '<td class="ops-act-cell"><span class="ops-badge">' + RD.esc(RD.actionNames[item.action] || item.action) + '</span></td>' +
        '<td class="ops-blk-cell">' + RD.esc(blocks || '整章') + '</td>' +
        '<td class="ops-stat-cell"><span class="ops-badge ' + (ok ? 'ok' : 'err') + '">' + (ok ? '完成' : '失败') + '</span>' +
          (usageParts.length ? '<div class="wb-sub">' + RD.esc(usageParts.join(' · ')) + '</div>' : '') + '</td>' +
        '<td class="ops-sum-cell">' + RD.esc(ok ? (item.summary || '—') : (item.error || item.summary || '失败')) + '</td>' +
        '<td class="ops-go-cell"><a class="ops-go" href="' + RD.chapterHref(item.uid, item.n, firstBlk) + '">定位 →</a></td>' +
      '</tr>';
    }).join('') + '</tbody></table></div></div>';
}
</script>
</body>
</html>
