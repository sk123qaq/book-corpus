<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>(function(){try{var q=new URLSearchParams(location.search).get("theme");if(q!=="warm"&&(q==="cold"||localStorage.getItem("reading-theme")==="cold"))document.documentElement.classList.add("cold")}catch(e){}})();</script>
<title>阅读工作台 · 书</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/pages.css">
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="marks"><i></i><i></i><i></i></span>分层读</a>
  <label class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
    <input id="top-q" placeholder="搜书名、作者、分类或章名" aria-label="搜索">
    <span class="kbd">/</span>
  </label>
  <nav class="nav">
    <a href="/">书架</a>
    <a href="/catalog">书目</a>
    <a href="/records">操作日志</a>
  </nav>
  <button class="icon-btn theme-btn" data-theme-toggle aria-label="切换冷纸版" title="切换暖纸/冷纸">
    <span class="when-warm">冷纸</span><span class="when-cold">暖纸</span>
  </button>
  <button class="icon-btn" id="night" aria-label="切换夜读" title="夜读">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 7 7 0 1 0 20 14.5Z"/></svg>
  </button>
</header>

<main class="page">
  <div class="crumb" id="crumb"></div>
  <div id="book-root"><div class="empty">正在翻书…</div></div>
</main>

<script src="/assets/app.js"></script>
<script src="/assets/common.js"></script>
<script src="/assets/theme.js"></script>
<script>
const UID = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
let data = null;

RD.ready(async () => {
  RD.night();
  try {
    data = await RD.api('/api/book/' + encodeURIComponent(UID));
  } catch (err) {
    RD.fail(RD.mount('book-root'), err.message);
    return;
  }
  render();
});

function render() {
  const book = data.book;
  const chapters = data.chapters || [];
  const chars = book.chars || 0;
  const packs = book.packs || 0;
  const firstRead = chapters[0];
  const notice = (new URLSearchParams(location.search).get('notice') || '').trim();

  RD.mount('crumb').innerHTML = '<a href="/">书架</a><i>/</i><a href="/catalog?q=' +
    encodeURIComponent((book.subjects || [])[0] || '') + '">' + RD.esc((book.subjects || [])[0] || '未分类') +
    '</a><i>/</i><span>' + RD.esc(book.title_short || book.title) + '</span>';
  document.title = '阅读工作台 · ' + (book.title_short || book.title);

  RD.mount('book-root').innerHTML =
    (notice ? '<div class="wb-top-drawer" style="margin-bottom:14px;padding:10px 14px;border-left:3px solid var(--ochre,#a87a3e)">' + RD.esc(notice) + '</div>' : '') +
    '<section class="book-hero">' +
      '<div class="cover" style="background:' + RD.esc(book.color) + '">' +
        '<span class="cv-kicker">正文工作台 · ' + RD.esc(book.uid) + '</span>' +
        '<span class="cv-title">' + RD.esc(book.title_short || book.title) + '</span>' +
        '<span class="cv-author">' + RD.esc(book.author_display) + '</span>' +
        '<span class="cv-stamp">可读</span></div>' +
      '<div class="book-copy"><div class="eyebrow">' + RD.esc((book.subjects || []).join(' · ') || '未分类') + '</div>' +
        '<h1>' + RD.esc(book.title) + '</h1>' +
        '<p class="sub">' + RD.esc(book.author_display) + ' · ' + RD.fmt(chapters.length) + ' 章 · 打开章节即看完整正文</p>' +
        '<div class="book-meta"><span><b>' + RD.fmt(chapters.length) + '</b>章</span>' +
          '<span><b>' + RD.wan(chars) + '</b>万字</span>' +
          '<span><b>' + RD.fmt(packs) + '</b>章有旁批/导图</span>' +
          '<span><b>' + RD.esc(book.uid) + '</b>书目号</span></div>' +
        '<div class="book-subjects">' + (book.subjects || []).map((s) => '<span>' + RD.esc(s) + '</span>').join('') +
          '<span>' + RD.esc(book.author_display) + '</span></div>' +
        '<div class="book-actions">' +
          (firstRead ? '<a class="btn btn-primary" href="' + RD.chapterHref(book.uid, firstRead.n) + '">翻开第 ' + RD.esc(firstRead.n) + ' 章 →</a>' : '') +
          '<a class="btn btn-ghost" href="/go/search?to=' + encodeURIComponent('/?books=' + encodeURIComponent(book.uid) + '&from=reading&mode=trace') + '" target="_blank" rel="noopener">在本书内检索 ↗</a>' +
        '</div></div></section>' +
    '<div class="work book-work">' +
      '<section><div class="section-title"><h2>章目</h2><span class="lbl">' + RD.fmt(chapters.length) + ' 章 · 点击直接阅读全文</span></div>' +
        '<div class="ch-list" id="ch-list"></div></section>' +
      '<aside class="ticket" id="book-notes-panel">' +
        '<div class="ticket-top"><span class="eyebrow">正文伴读工作台</span><span class="ticket-id">' + RD.esc(book.uid) + '</span></div>' +
        '<h3>随文阅读工具</h3>' +
        '<p class="ticket-meta">进章即看 100% 完整正文；划选段落或点击 ✦ 可按需调用讲人话、翻译原意、图解、拆解前提或追问，回答可钉住为永久旁批。</p>' +
        '<div class="existing" id="book-notes-summary"></div>' +
      '</aside>' +
    '</div>';

  RD.mount('ch-list').innerHTML = chapters.map((ch) => {
    const badges = [];
    if (ch.has_map) badges.push('导图');
    if (ch.note_count) badges.push(ch.note_count + ' 条旁批');
    const stateLabel = badges.length ? badges.join(' · ') : '直读全文';
    return '<a class="ch-row" href="' + RD.chapterHref(book.uid, ch.n) + '">' +
      '<span class="ch-n">' + RD.esc(ch.n) + '</span>' +
      '<span class="ch-title">' + RD.esc(ch.title) + '<small>' + RD.esc(ch.file) + ' · ' + RD.fmt(ch.chars) + ' 字</small></span>' +
      '<span class="ch-chars">' + RD.fmt(ch.chars) + ' 字</span>' +
      '<span class="ch-min">' + RD.fmt(ch.minutes) + ' 分钟</span>' +
      '<span class="ch-state' + (badges.length ? ' has' : '') + '">' + RD.esc(stateLabel) + '</span>' +
      '<span class="ch-go" aria-hidden="true">→</span></a>';
  }).join('');

  const activeChapters = chapters.filter((ch) => ch.has_map || ch.note_count > 0 || ch.ops_count > 0);
  RD.mount('book-notes-summary').innerHTML = activeChapters.length
    ? '<div class="lbl">近期伴读章目</div>' + activeChapters.slice(0, 5).map((ch) =>
        '<div class="pack-row"><span>第 ' + RD.esc(ch.n) + ' 章 · ' + RD.esc(ch.title) + '</span>' +
        '<a href="' + RD.chapterHref(book.uid, ch.n) + '">继续 →</a></div>'
      ).join('')
    : '<div class="lbl">近期伴读章目</div><p class="fine" style="margin:4px 0 0">尚未生成导图或旁批。翻开任意章节即可使用顶部知识地图与划词浮动工具条。</p>';
}
</script>
</body>
</html>
