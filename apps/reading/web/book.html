<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" id="meta-theme-color" content="#F4F1E8">
<script>(function(){try{var r=document.documentElement,sp=new URLSearchParams(location.search),q=sp.get("theme"),n=localStorage.getItem("reading-night")==="1",t=localStorage.getItem("reading-theme");if(q==="cold"||q==="warm"){t=q;n=false;}if(n){r.setAttribute("data-theme","night");r.dataset.bootNight="1";}else if(t==="cold"){r.classList.add("cold");r.setAttribute("data-theme","cold");}else{r.setAttribute("data-theme","warm");}}catch(e){}})();</script>
<title>伴读 · 书页</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/pages.css">
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body>
<a class="skip-link" href="#main-content">跳至主要内容</a>
<header class="topbar" id="topbar">
  <div class="top-left">
    <a class="brand" href="/"><span class="brand-seal" aria-hidden="true">伴</span><span class="brand-name" translate="no">伴读</span></a>
  </div>
  <div class="top-right">
    <label class="top-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
      <input id="top-q" type="search" autocomplete="off" placeholder="搜书名、作者或章名…" aria-label="快速搜索书目">
      <span class="kbd" aria-hidden="true">/</span>
    </label>
    <nav class="main-nav" aria-label="伴读主导航">
      <a class="nav-tab" href="/">书架</a>
      <a class="nav-tab" href="/catalog">书目</a>
      <a class="nav-tab" href="/records">日志</a>
    </nav>
    <div class="theme-seg" role="group" aria-label="纸色主题">
      <button type="button" data-theme-choice="warm" aria-pressed="true">暖纸</button>
      <button type="button" data-theme-choice="cold" data-theme-toggle aria-pressed="false">冷纸</button>
      <button type="button" id="night" data-theme-choice="night" aria-pressed="false" aria-label="切换夜读" title="夜读模式">夜读</button>
    </div>
  </div>
</header>

<main class="page" id="main-content">
  <div class="crumb" id="crumb"></div>
  <div id="book-root"><div class="empty">正在翻书…</div></div>
</main>

<script src="/assets/app.js"></script>
<script src="/assets/common.js"></script>
<script src="/assets/theme.js"></script>
<script>
const UID = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
let data = null;

RD.ready(async () => {
  RD.night();
  try {
    data = await RD.api('/api/book/' + encodeURIComponent(UID));
  } catch (err) {
    RD.fail(RD.mount('book-root'), err.message);
    return;
  }
  render();
});

function render() {
  const book = data.book;
  const chapters = data.chapters || [];
  const chars = book.chars || 0;
  const packs = book.packs || 0;
  const firstRead = chapters[0];
  const notice = (new URLSearchParams(location.search).get('notice') || '').trim();
  // 页头章数与逐书统计走 md 文件视角（与书架同源）；页内章目是合并标题页后的导航章数。
  // 两者不一致（有标题页合并）时必须就地说明，不许页头 65、页内 36 而无注。
  const fileCount = book.chapters || chapters.length;
  const navCount = chapters.length;
  const mergeNote = fileCount !== navCount
    ? '（本页 ' + RD.fmt(navCount) + ' 章，由 ' + RD.fmt(fileCount) + ' 个 md 文件合并标题页而来）'
    : '';

  RD.mount('crumb').innerHTML = '<a href="/">书架</a><i>/</i><a href="/catalog?q=' +
    encodeURIComponent((book.subjects || [])[0] || '') + '">' + RD.esc((book.subjects || [])[0] || '未分类') +
    '</a><i>/</i><span>' + RD.esc(book.title_short || book.title) + '</span>';
  document.title = '伴读 · ' + (book.title_short || book.title);

  RD.mount('book-root').innerHTML =
    (notice ? '<div class="ticket" style="margin-bottom:16px;padding:12px 16px;border-left:3px solid var(--amber)">' + RD.esc(notice) + '</div>' : '') +
    '<section class="book-hero">' +
      '<div class="cover" style="background:' + RD.esc(book.color) + '">' +
        '<span class="cv-kicker">伴读工作台 · ' + RD.esc(book.uid) + '</span>' +
        '<span class="cv-title">' + RD.esc(book.title_short || book.title) + '</span>' +
        '<span class="cv-author">' + RD.esc(book.author_display) + '</span>' +
        '<span class="cv-stamp">可读</span></div>' +
      '<div class="book-copy"><div class="eyebrow">' + RD.esc((book.subjects || []).join(' · ') || '未分类') + '</div>' +
        '<h1>' + RD.esc(book.title) + '</h1>' +
        '<p class="sub">' + RD.esc(book.author_display) + ' · ' + RD.fmt(fileCount) + ' 章' + mergeNote + ' · 打开章节即看完整正文</p>' +
        '<div class="book-meta"><span title="md 文件：拆章后的 Markdown 文件数，未合并标题页"><b>' + RD.fmt(fileCount) + '</b>章</span>' +
          '<span title="非空白正文字数，每个 md 文件恰计一次"><b>' + RD.wan(chars) + '</b>万字</span>' +
          '<span><b>' + RD.fmt(packs) + '</b>章有旁批/导图</span>' +
          '<span><b>' + RD.esc(book.uid) + '</b>书目号</span></div>' +
        '<div class="book-subjects">' + (book.subjects || []).map((s) => '<span>' + RD.esc(s) + '</span>').join('') +
          '<span>' + RD.esc(book.author_display) + '</span></div>' +
        '<div class="book-actions">' +
          (firstRead ? '<a class="btn btn-primary" href="' + RD.chapterHref(book.uid, firstRead.n) + '">翻开第 ' + RD.esc(firstRead.n) + ' 章 →</a>' : '') +
          '<a class="btn btn-ghost" href="/go/search?to=' + encodeURIComponent('/?books=' + encodeURIComponent(book.uid) + '&from=reading&mode=trace') + '" target="_blank" rel="noopener">在本书内检索 ↗</a>' +
        '</div></div></section>' +
    '<div class="work book-work">' +
      '<section><div class="section-title"><h2>章目</h2><span class="lbl">' + RD.fmt(navCount) + ' 章 · 点击直接阅读全文' + mergeNote + '</span></div>' +
        '<div class="ch-list" id="ch-list"></div></section>' +
      '<aside class="ticket" id="book-notes-panel">' +
        '<div class="ticket-top"><span class="eyebrow">伴读工作台</span><span class="ticket-id">' + RD.esc(book.uid) + '</span></div>' +
        '<h3>随文阅读工具</h3>' +
        '<p class="ticket-meta">进章即看 100% 完整正文；划选段落或点击 ✦ 可按需调用讲人话、翻译原意、图解、拆解前提或追问，回答可钉住为永久旁批。</p>' +
        '<div class="existing" id="book-notes-summary"></div>' +
      '</aside>' +
    '</div>';

  RD.mount('ch-list').innerHTML = chapters.map((ch) => {
    const badges = [];
    if (ch.has_map) badges.push('导图');
    if (ch.note_count) badges.push(ch.note_count + ' 条旁批');
    const stateLabel = badges.length ? badges.join(' · ') : '直读全文';
    return '<a class="ch-row" href="' + RD.chapterHref(book.uid, ch.n) + '">' +
      '<span class="ch-n">' + RD.esc(ch.n) + '</span>' +
      '<span class="ch-title">' + RD.esc(ch.title) + '<small>' + RD.esc(ch.file) + ' · ' + RD.fmt(ch.chars) + ' 字</small></span>' +
      '<span class="ch-chars">' + RD.fmt(ch.chars) + ' 字</span>' +
      '<span class="ch-min">' + RD.fmt(ch.minutes) + ' 分钟</span>' +
      '<span class="ch-state' + (badges.length ? ' has' : '') + '">' + RD.esc(stateLabel) + '</span>' +
      '<span class="ch-go" aria-hidden="true">→</span></a>';
  }).join('');

  const activeChapters = chapters.filter((ch) => ch.has_map || ch.note_count > 0 || ch.ops_count > 0);
  RD.mount('book-notes-summary').innerHTML = activeChapters.length
    ? '<div class="lbl">近期伴读章目</div>' + activeChapters.slice(0, 5).map((ch) =>
        '<div class="pack-row"><span>第 ' + RD.esc(ch.n) + ' 章 · ' + RD.esc(ch.title) + '</span>' +
        '<a href="' + RD.chapterHref(book.uid, ch.n) + '">继续 →</a></div>'
      ).join('')
    : '<div class="lbl">近期伴读章目</div><p class="fine" style="margin:4px 0 0">尚未生成导图或旁批。翻开任意章节即可使用左侧知识地图与划词浮动工具条。</p>';
}
</script>
</body>
</html>
