<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" id="meta-theme-color" content="#F4F1E8">
<script>(function(){try{var r=document.documentElement,sp=new URLSearchParams(location.search),q=sp.get("theme"),n=localStorage.getItem("reading-night")==="1",t=localStorage.getItem("reading-theme");if(q==="cold"||q==="warm"){t=q;n=false;}if(n){r.setAttribute("data-theme","night");r.dataset.bootNight="1";}else if(t==="cold"){r.classList.add("cold");r.setAttribute("data-theme","cold");}else{r.setAttribute("data-theme","warm");}}catch(e){}})();</script>
<title>伴读 · 阅读工作台</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/theme.css">
<link rel="stylesheet" href="/assets/workbench.css">
</head>
<body class="chapter-desk">
<a class="skip-link" href="#main-content">跳至主要内容</a>
<div class="reading-progress" aria-hidden="true"><i id="reading-progress-bar"></i></div>

<header class="topbar desk-topbar" id="topbar">
  <div class="top-left desk-top-left">
    <button type="button" class="icon-btn desk-icon-btn" id="btn-spine" aria-pressed="true" aria-label="收起或展开左侧书脊" title="书脊导航（快捷键 [）">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
    </button>
    <a class="brand desk-brand" href="/"><span class="brand-seal" aria-hidden="true">伴</span><span class="brand-name desk-brand-text" translate="no">伴读</span></a>
    <span class="vsep desk-vsep hide-sm" aria-hidden="true"></span>
    <div class="crumb desk-crumb" id="crumb"></div>
  </div>

  <div class="top-right desk-top-right">
    <label class="top-search search desk-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
      <input id="top-q" type="search" autocomplete="off" placeholder="搜书目或章名" aria-label="搜索">
      <span class="kbd" aria-hidden="true">/</span>
    </label>
    <nav class="main-nav nav desk-nav" aria-label="伴读主导航">
      <a class="nav-tab" href="/">书架</a>
      <a class="nav-tab" href="/catalog">书目</a>
      <a class="nav-tab" href="/records">日志</a>
    </nav>
    <div class="popover-wrap desk-popover-wrap" id="typo-wrap">
      <button type="button" class="icon-btn desk-icon-btn desk-typo-btn" id="btn-typo" popovertarget="typo-popover" aria-expanded="false" aria-label="排版设置" title="字号、版宽与专注模式"><span style="font-family:var(--serif);font-weight:700">Aa</span></button>
      <div class="popover-card desk-popover" id="typo-popover" popover="auto" aria-label="排版设置">
        <div class="pop-row desk-pop-row">
          <span class="pop-lbl desk-pop-lbl">正文字号</span>
          <div class="seg-group desk-seg" role="group" aria-label="正文字号">
            <button type="button" data-font-size="16" aria-pressed="false">小</button>
            <button type="button" data-font-size="18" aria-pressed="true">标准</button>
            <button type="button" data-font-size="20" aria-pressed="false">大</button>
          </div>
        </div>
        <div class="pop-row desk-pop-row">
          <span class="pop-lbl desk-pop-lbl">阅读版宽</span>
          <div class="seg-group desk-seg" role="group" aria-label="阅读版宽">
            <button type="button" data-measure="600" aria-pressed="false">窄</button>
            <button type="button" data-measure="680" aria-pressed="true">适中</button>
            <button type="button" data-measure="780" aria-pressed="false">宽</button>
          </div>
        </div>
        <div class="pop-foot desk-pop-foot">
          <button type="button" class="pop-action desk-pop-action" id="btn-focus-mode" aria-pressed="false">专注阅读（隐藏左右栏）</button>
        </div>
      </div>
    </div>
    <div class="theme-seg" role="group" aria-label="纸色主题">
      <button type="button" data-theme-choice="warm" aria-pressed="true">暖纸</button>
      <button type="button" data-theme-choice="cold" data-theme-toggle aria-pressed="false">冷纸</button>
      <button type="button" id="night" data-theme-choice="night" aria-pressed="false" aria-label="切换夜读" title="夜读模式">夜读</button>
    </div>
    <button type="button" class="icon-btn desk-icon-btn" id="btn-drawer-top" aria-pressed="true" aria-label="收起或展开伴读面板" title="伴读面板（快捷键 ]）">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
    </button>
  </div>
</header>

<main class="wb-shell" id="main-content">
  <div id="wb-root"><div class="desk-loading">正在展开全章正文…</div></div>
</main>

<div class="desk-backdrop" id="desk-backdrop" hidden></div>
<div class="selection-bar" id="selection-bar" role="toolbar" aria-label="划词伴读工具"></div>
<div class="fn-return-bar" id="fn-return-bar" hidden role="region" aria-label="注释返回条"></div>
<div class="fn-tip-popover" id="fn-tip-popover" popover="auto" aria-label="注释提示"></div>

<script src="/assets/app.js"></script>
<script src="/assets/common.js"></script>
<script src="/assets/theme.js"></script>
<script src="/assets/diagram_renderer.js"></script>
<script src="/assets/chapter.js"></script>
</body>
</html>
