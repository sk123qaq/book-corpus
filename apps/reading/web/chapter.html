<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>(function(){try{var q=new URLSearchParams(location.search).get("theme");if(q!=="warm"&&(q==="cold"||localStorage.getItem("reading-theme")==="cold"))document.documentElement.classList.add("cold")}catch(e){}})();</script>
<title>分层读 · 阅读工作台</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/pages.css">
<link rel="stylesheet" href="/assets/theme.css">
<link rel="stylesheet" href="/assets/workbench.css">
</head>
<body class="chapter-desk">
<header class="topbar desk-topbar">
  <div class="desk-top-left">
    <button type="button" class="desk-icon-btn" id="btn-spine" aria-pressed="true" aria-label="收起或展开左侧书脊" title="书脊导航（快捷键 [）">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
    </button>
    <a class="brand desk-brand" href="/"><span class="marks"><i></i><i></i><i></i></span><span class="desk-brand-text">分层读</span></a>
    <span class="desk-vsep" aria-hidden="true"></span>
    <div class="crumb desk-crumb" id="crumb"></div>
  </div>

  <div class="desk-top-right">
    <label class="search desk-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
      <input id="top-q" placeholder="搜书目或章名" aria-label="搜索">
      <span class="kbd">/</span>
    </label>
    <nav class="nav desk-nav" aria-label="主导航">
      <a href="/">书架</a>
      <a href="/catalog">书目</a>
      <a href="/records">日志</a>
    </nav>
    <span class="desk-vsep desk-hide-sm" aria-hidden="true"></span>
    <div class="desk-popover-wrap">
      <button type="button" class="desk-icon-btn desk-typo-btn" id="btn-typo" aria-expanded="false" aria-label="排版设置" title="字号、版宽与专注模式">Aa</button>
      <div class="desk-popover" id="typo-popover" hidden>
        <div class="desk-pop-row">
          <span class="desk-pop-lbl">字号</span>
          <div class="desk-seg" role="group" aria-label="字号">
            <button type="button" data-font-size="16">小</button>
            <button type="button" data-font-size="18">标准</button>
            <button type="button" data-font-size="20">大</button>
          </div>
        </div>
        <div class="desk-pop-row">
          <span class="desk-pop-lbl">版宽</span>
          <div class="desk-seg" role="group" aria-label="版宽">
            <button type="button" data-measure="600">窄</button>
            <button type="button" data-measure="680">适中</button>
            <button type="button" data-measure="780">宽</button>
          </div>
        </div>
        <div class="desk-pop-foot">
          <button type="button" class="desk-pop-action" id="btn-focus-mode">专注阅读（收起双栏）</button>
        </div>
      </div>
    </div>
    <button class="desk-icon-btn theme-btn" data-theme-toggle aria-label="切换冷纸版" title="切换暖纸/冷纸">
      <span class="when-warm">冷纸</span><span class="when-cold">暖纸</span>
    </button>
    <button class="desk-icon-btn" id="night" aria-label="切换夜读" title="夜读模式">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 7 7 0 1 0 20 14.5Z"/></svg>
    </button>
    <button type="button" class="desk-icon-btn" id="btn-drawer-top" aria-pressed="true" aria-label="收起或展开伴读面板" title="伴读面板（快捷键 ]）">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
    </button>
  </div>
  <div class="reading-progress" aria-hidden="true"><i id="reading-progress-bar"></i></div>
</header>

<main class="wb-shell">
  <div id="wb-root"><div class="desk-loading">正在展开全章正文…</div></div>
</main>

<div class="desk-backdrop" id="desk-backdrop" hidden></div>
<div class="selection-bar" id="selection-bar" role="toolbar" aria-label="划词伴读工具"></div>

<script src="/assets/app.js"></script>
<script src="/assets/common.js"></script>
<script src="/assets/theme.js"></script>
<script src="/assets/diagram_renderer.js"></script>
<script src="/assets/chapter.js"></script>
</body>
</html>
