<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>(function(){try{var q=new URLSearchParams(location.search).get("theme");if(q!=="warm"&&(q==="cold"||localStorage.getItem("reading-theme")==="cold"))document.documentElement.classList.add("cold")}catch(e){}})();</script>
<title>阅读工作台</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/pages.css">
<link rel="stylesheet" href="/assets/theme.css">
<link rel="stylesheet" href="/assets/workbench.css">
</head>
<body class="chapter-desk">
<header class="topbar">
  <a class="brand" href="/"><span class="marks"><i></i><i></i><i></i></span>分层读</a>
  <label class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
    <input id="top-q" placeholder="搜书名、作者、分类或章名" aria-label="搜索">
    <span class="kbd">/</span>
  </label>
  <nav class="nav">
    <a href="/">书架</a>
    <a href="/catalog">书目</a>
    <a href="/records">操作日志</a>
  </nav>
  <button type="button" class="wb-btn wb-spine-toggle" id="btn-spine" aria-pressed="true" title="收起或展开左侧书脊目录">☰ 书脊</button>
  <button class="icon-btn theme-btn" data-theme-toggle aria-label="切换冷纸版" title="切换暖纸/冷纸">
    <span class="when-warm">冷纸</span><span class="when-cold">暖纸</span>
  </button>
  <button class="icon-btn" id="night" aria-label="切换夜读" title="夜读">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 7 7 0 1 0 20 14.5Z"/></svg>
  </button>
</header>

<main class="wb-shell">
  <div class="crumb" id="crumb"></div>
  <div id="wb-root"><div class="empty">正在展开全章正文…</div></div>
</main>

<div class="selection-bar" id="selection-bar" role="toolbar" aria-label="划词伴读工具"></div>

<script src="/assets/app.js"></script>
<script src="/assets/common.js"></script>
<script src="/assets/theme.js"></script>
<script src="/assets/diagram_renderer.js"></script>
<script src="/assets/chapter.js"></script>
</body>
</html>
