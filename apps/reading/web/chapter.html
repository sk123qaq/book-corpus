<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>(function(){try{var q=new URLSearchParams(location.search).get("theme");if(q!=="warm"&&(q==="cold"||localStorage.getItem("reading-theme")==="cold"))document.documentElement.classList.add("cold")}catch(e){}})();</script>
<title>分层读 · 章节工单</title>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/pages.css">
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="marks"><i></i><i></i><i></i></span>分层读</a>
  <label class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
    <input id="top-q" placeholder="搜书名、作者、分类或章名" aria-label="搜索">
    <span class="kbd">/</span>
  </label>
  <nav class="nav">
    <a href="/">书架</a>
    <a href="/catalog">书目</a>
    <a href="/records">记录</a>
  </nav>
  <button class="icon-btn theme-btn" data-theme-toggle aria-label="切换冷纸版" title="切换暖纸/冷纸">
    <span class="when-warm">冷纸</span><span class="when-cold">暖纸</span>
  </button>
  <button class="icon-btn" id="night" aria-label="切换夜读" title="夜读">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 7 7 0 1 0 20 14.5Z"/></svg>
  </button>
</header>

<main class="page">
  <div class="crumb" id="crumb"></div>
  <div id="chapter-root"><div class="empty">正在取章…</div></div>
</main>

<script src="/assets/app.js"></script>
<script src="/assets/common.js"></script>
<script src="/assets/theme.js"></script>
<script>
const PARTS = location.pathname.split('/').filter(Boolean);
const UID = decodeURIComponent(PARTS[1] || '');
const N = PARTS[2] || '';
const TIER_KEYS = ['skim', 'standard', 'deep'];
const DEPTH_KEYS = ['model', 'panels', 'skim', 'standard', 'deep'];
let data = null;
let draft = false;
let selected = new Set(['standard']);
let depthSelected = null;
let depthBusy = false;
const pending = new Set();
let pendingBusy = false;
let modeBusy = false;
const polling = new Set();

RD.ready(async () => {
  RD.night();
  await load();
});

async function load() {
  try {
    data = await RD.api('/api/chapter/' + encodeURIComponent(UID) + '/' + encodeURIComponent(N));
  } catch (err) {
    RD.fail(RD.mount('chapter-root'), err.message);
    return;
  }
  data.jobs = data.jobs || [];
  if (data.depth) {
    const layers = data.depth.layers || {};
    // 默认只勾「缺失 / 失败 / 过期」：已就绪的层默认保留，不白花调用。
    depthSelected = new Set(DEPTH_KEYS.filter((key) => {
      const status = (layers[key] || {}).status;
      return status === 'missing' || status === 'failed' || status === 'stale';
    }));
  } else {
    depthSelected = null;
  }
  depthBusy = false;
  pending.clear();
  pendingBusy = false;
  render();
  bind();
}

function render() {
  const book = data.book;
  const chapter = data.chapter;
  const blocks = data.blocks || [];
  const tiers = data.tiers || [];
  const preview = new Set(data.preview_blocks || []);
  const standardBlocks = new Set(data.standard_blocks || []);
  draft = !!(data.pack && data.pack.draft);
  const path = data.path === 'depth' ? 'depth' : data.path === 'legacy' ? 'legacy' : 'none';
  const pathLabel = path === 'depth' ? '深度路径' : path === 'legacy' ? '旧路径' : '未生成';
  const pathReason = data.fallback_reason ? ' title="' + RD.esc(data.fallback_reason) + '"' : '';
  const generated = tiers.filter((t) => t.exists);
  const standardPack = generated.some((t) => t.key === 'standard');
  document.title = '分层读 · ' + chapter.title;
  const prev = Number(chapter.n) > 1 ? String(Number(chapter.n) - 1).padStart(2, '0') : '';
  const next = Number(chapter.n) < book.chapters ? String(Number(chapter.n) + 1).padStart(2, '0') : '';
  RD.mount('crumb').innerHTML = '<a href="/">书架</a><i>/</i><a href="' + RD.bookHref(book.uid) + '">' +
    RD.esc(book.title_short || book.title) + '</a><i>/</i><span>第 ' + String(chapter.n).replace(/^0/, '') + ' 章</span>';

  RD.mount('chapter-root').innerHTML =
    '<section class="chap-head"><div class="eyebrow">' + RD.esc(book.uid) + ' · ' + RD.esc(book.title_short || book.title) + '</div>' +
      '<h1>' + RD.esc(chapter.title) + '</h1>' +
      '<p class="chap-meta">' + RD.fmt(chapter.chars) + ' 字 · ' + RD.fmt(blocks.length) + ' 个原文块 · 标准本约 ' +
        RD.fmt(chapter.minutes) + ' 分钟 · ' + RD.esc(chapter.file) +
        ' · <span class="path-badge path-badge-' + path + '"' + pathReason + '>' + pathLabel + '</span>' +
        (draft ? ' · <span class="draft-badge">草稿</span>' : '') + '</p>' +
      '<div class="chap-actions">' +
        (generated.length ? generated.map((t) => '<a class="btn btn-primary" href="' + RD.readerHref(book.uid, chapter.n, t.key, data.path) + '">读 ' + RD.esc(t.name) + '本 →</a>').join('') :
          '<a class="btn btn-ghost" href="#ticket">先出一版读本</a>') +
        (data.edition ? '<a class="btn btn-primary" href="' + RD.esc(data.edition.url) + '">视觉读本 →</a>' : '') +
        (standardPack ? '<a class="btn btn-ghost" href="' + RD.readerHref(book.uid, chapter.n, 'standard', data.path) + '">打开默认读本</a>' : '') +
        (prev ? '<a class="btn btn-ghost" href="' + RD.chapterHref(book.uid, prev) + '">← 上一章</a>' : '') +
        (next ? '<a class="btn btn-ghost" href="' + RD.chapterHref(book.uid, next) + '">下一章 →</a>' : '') +
      '</div></section>' +
    '<div class="work">' +
      '<section>' +
        '<div class="section-title"><h2>原文切块</h2><span class="lbl">只读 · 逐字保留</span></div>' +
        '<p class="hint">共 ' + RD.fmt(blocks.length) + ' 块。色块标出标准本保留的块；下方只预览前 8 块，全文见读本。</p>' +
        '<div class="cutbar"><div class="cutbar-head"><span class="lbl">' + RD.fmt(blocks.length) + ' 块</span>' +
          '<span><b>' + RD.fmt(standardBlocks.size) + '</b> 块进标准本</span></div><div class="ticks" id="ticks"></div></div>' +
        '<div class="preview" id="preview"></div>' +
        '<div class="section-title"><h2>三档状态</h2><span class="lbl">存在于 工作区/阅读</span></div>' +
        '<div class="pack-list" id="packs"></div>' +
        '<div class="section-title"><h2>门槛</h2><span class="lbl">最近一次生成</span></div>' +
        '<div class="gate-list" id="gates"></div>' +
        '<div id="depth-root">' + depthPanelHtml() + '</div>' +
      '</section>' +
      '<aside class="ticket" id="ticket">' + ticketHtml() + '</aside>' +
    '</div>' +
    '<div class="pager"><span>' + (prev ? '<a href="' + RD.chapterHref(book.uid, prev) + '">← ' + RD.esc(prev) + '</a>' : '') +
      '</span><a href="' + RD.bookHref(book.uid) + '">返回章目</a><span>' +
      (next ? '<a href="' + RD.chapterHref(book.uid, next) + '">' + RD.esc(next) + ' →</a>' : '') + '</span></div>';

  renderTicks(blocks, standardBlocks);
  renderPreview(blocks, preview, standardPack);
  renderPacks(generated);
  renderGates();
  bindTicket();
}

function ticketHtml() {
  const chapter = data.chapter;
  const fit = data.edition_fit || { ok: true, reason: '' };
  const running = (data.jobs || []).filter((job) =>
    RD.activeStates.includes(job.state) || job.state === 'cancelled'
  );
  return '<div class="ticket-top"><span class="eyebrow">读本工单</span><span class="ticket-id">#' +
    RD.esc(data.book.uid) + '-' + RD.esc(chapter.n) + '</span></div>' +
    '<h3>' + RD.esc(chapter.title) + '</h3>' +
    '<p class="ticket-meta">' + RD.fmt(chapter.chars) + ' 字 · 原文约 ' + RD.fmt(chapter.minutes) + ' 分钟</p>' +
    '<div class="mode-box" id="mode-root">' + modeSelectorHtml() + '</div>' +
    '<div class="tier-list" id="tier-list">' + TIER_KEYS.map(tierOption).join('') + '</div>' +
    RD.modelSettingsHtml() +
    '<div class="ticket-est"><span id="ticket-est"></span><span>本地队列 · 最多 4 个并行</span></div>' +
    (running.length ? '<p class="fine job-live">进行中：' + running.map((job) => {
      const name = job.kind === 'depth'
        ? (job.layers || []).map((layer) => RD.depthNames[layer] || layer).join('/')
        : (job.tiers || []).map((tier) => RD.tierNames[tier] || tier).join('/');
      return RD.esc(name || '—') + ' · ' + RD.esc(RD.jobHint(job)) + ' · ' + RD.esc(job.id);
    }).join('；') + '</p>' : '') +
    '<button class="btn btn-primary" id="generate">生成读本 →</button>' +
    '<button class="btn btn-ghost" id="generate-edition"' + (fit.ok ? '' : ' disabled title="' + RD.esc(fit.reason) + '"') + '>生成视觉读本（模型约 30–60 秒）</button>' +
    (fit.ok ? '' : '<p class="fine edition-fit">本章不宜视觉读本：' + RD.esc(fit.reason) + '</p>') +
    '<div id="job-mount"></div>' +
    '<p class="fine">' + (draft ? '当前是草稿：三档暂时同文，讲解为空。接入模型后重新生成才会产生取舍。' :
      '原文逐字保留；讲解只做旁批，可一键隐藏。原文不重写、不合并。') + '</p>';
}


const MODE_META = {
  narrative: { label: '叙事', desc: '人物、场景、情节与手法' },
  argument: { label: '论证', desc: '命题、论据、推理与反驳' },
  practical: { label: '实用', desc: '步骤、清单、决策与做法' },
  reference: { label: '资料·图册', desc: '图版、条目、术语与版本' },
};

function modeInfo() {
  return data.reading || {};
}

function modeLabel(mode) {
  return (MODE_META[mode] || {}).label || mode || '未定';
}

function modeSelectorHtml() {
  const r = modeInfo();
  const bookMode = r.book_mode || '';
  const override = r.chapter_override || '';
  const pending = r.chapter_override_pending || '';
  const pendingStale = Boolean(r.chapter_override_stale && pending);
  const effective = r.effective_mode || 'argument';
  const suggestion = r.suggestion || {};
  const follow = Boolean(bookMode && !override);
  const modes = ['narrative', 'argument', 'practical', 'reference'];
  const confirmed = suggestion.mode && suggestion.source === 'model' ? '模型建议' : '建议';
  return '<div class="mode-head"><span class="lbl">本章读法</span>' +
      '<span class="mode-hint">读法不改档位</span></div>' +
    '<label class="mode-follow' + (bookMode ? '' : ' is-empty') + '">' +
      '<input type="checkbox" id="mode-follow"' + (follow ? ' checked' : '') +
      (bookMode && !modeBusy ? '' : ' disabled') + '>' +
      '<span>跟随本书' + (bookMode ? '（' + RD.esc(modeLabel(bookMode)) + '）' : '（未设）') + '</span>' +
    '</label>' +
    '<div class="mode-grid">' + modes.map(function (mode) {
      return '<button type="button" class="mode-btn' + (effective === mode ? ' active' : '') +
        '" data-mode="' + mode + '"' + (modeBusy ? ' disabled' : '') + '>' +
        '<b>' + RD.esc(MODE_META[mode].label) + '</b><small>' + RD.esc(MODE_META[mode].desc) + '</small>' +
        (suggestion.mode === mode ? '<em class="mode-suggest-dot">' + RD.esc(confirmed) + '</em>' : '') +
        '</button>';
    }).join('') + '</div>' +
    (suggestion.mode ? '<div class="mode-suggest"><b>' + RD.esc(confirmed) + '：' + RD.esc(modeLabel(suggestion.mode)) +
      (suggestion.confidence ? ' · 置信度 ' + Number(suggestion.confidence).toFixed(2) : '') + '</b>' +
      '<span>' + RD.esc(suggestion.reason || '') + '</span></div>' : '') +
    (suggestion.evidence && suggestion.evidence.length ? '<div class="mode-evidence">' +
      suggestion.evidence.map(function (item) {
        return '<span><i>' + RD.esc(item.label) + '</i>' + RD.esc(item.value) + '</span>';
      }).join('') + '</div>' : '') +
    (override ? '<div class="mode-override">本章覆写：<b>' + RD.esc(modeLabel(override)) +
      '</b><span>（不跟随本书）</span><button type="button" id="mode-reset">恢复跟随本书</button></div>' : '') +
    (pendingStale ? '<div class="mode-override">本章覆写：<b>' + RD.esc(modeLabel(pending)) +
      '</b><span>（原文已变，待确认）</span><button type="button" id="mode-confirm">确认覆写</button>' +
      '<button type="button" id="mode-reset">放弃覆写</button></div>' : '') +
    (!bookMode ? '<div class="mode-warning">本书还没有默认读法；点一个模式会先设为本书默认。</div>' : '') +
    '<div class="mode-foot">档位在下方单独选；读法只改注解与面板。</div>';
}

function refreshMode() {
  const root = RD.mount('mode-root');
  if (!root) return;
  root.innerHTML = modeSelectorHtml();
  bindMode();
  updateEstimate();
}

async function putReading(action, mode) {
  if (modeBusy) return;
  modeBusy = true;
  refreshMode();
  try {
    const result = await RD.api('/api/chapter/' + encodeURIComponent(UID) + '/' + encodeURIComponent(N) + '/reading', {
      method: 'PUT',
      body: { action: action, mode: mode },
    });
    data.reading = result;
    RD.toast('本章读法：' + modeLabel(result.effective_mode));
  } catch (err) {
    if (err.code === 'reading_profile_required') {
      RD.toast('先设本书默认读法，再设章级覆写', true);
    } else {
      RD.toast(err.message, true);
    }
  } finally {
    modeBusy = false;
    refreshMode();
  }
}

function bindMode() {
  const root = RD.mount('mode-root');
  if (!root) return;
  root.onclick = function (event) {
    const button = event.target.closest('[data-mode]');
    if (button) {
      const mode = button.getAttribute('data-mode');
      const r = modeInfo();
      if (!r.book_mode) {
        putReading('book_default', mode);
      } else if (mode === r.book_mode && !r.chapter_override) {
        return;
      } else if (mode === r.book_mode) {
        putReading('follow');
      } else if (mode === r.chapter_override) {
        return;
      } else {
        putReading('override', mode);
      }
      return;
    }
    if (event.target.closest('#mode-confirm')) {
      putReading('override', modeInfo().chapter_override_pending);
      return;
    }
    if (event.target.closest('#mode-reset')) {
      putReading('follow');
    }
  };
  root.onchange = function (event) {
    if (event.target && event.target.id === 'mode-follow') {
      if (event.target.checked) putReading('follow');
      else RD.toast('选一个模式覆盖本书，或重新打开跟随', true);
    }
  };
}

function tierOption(key) {
  const info = (data.tiers || []).find((t) => t.key === key) || {};
  const job = RD.jobForTier(data.jobs, key);
  const busy = Boolean(job || pending.has(key));
  const busyText = job ? RD.jobHint(job) : '提交中';
  const spec = 'C ' + Math.round(info.c_min * 100) + '–' + Math.round(info.c_max * 100) + '% · E ≤' +
    Math.round((info.e_max || 0) * 100) + '% · ' + RD.fmt(info.speed || 0) + ' 字/分';
  const minutes = info.stats ? info.stats.minutes : Math.max(1, Math.round(data.chapter.chars / (info.speed || 500)));
  return '<label class="tier-opt' + (selected.has(key) ? ' checked' : '') + (busy ? ' busy' : '') +
    '"><input type="checkbox" value="' + key + '"' +
    (selected.has(key) ? ' checked' : '') + '><span class="box"></span>' +
    '<span class="tier-dot" style="--tc:var(--tier-' + key + ')"></span>' +
    '<span class="tier-copy"><b>' + (info.name || RD.tierNames[key]) +
      (busy ? '<em class="tier-busy">' + RD.esc(busyText) + '</em>' : info.exists ? '<em>' + (draft ? '草稿' : '已出片') + '</em>' : '') +
      '</b><small>' + spec + '</small></span>' +
    '<span class="tier-time">≈' + RD.fmt(minutes) + ' 分钟<small>' +
      (busy ? (job ? RD.esc(job.id) : '正在提交') : info.stale ? '原文已改' : info.exists ? (draft ? '待补模型' : '可重生成') : '未生成') +
      '</small></span></label>';
}

function refreshTiers() {
  const list = RD.mount('tier-list');
  if (list) list.innerHTML = TIER_KEYS.map(tierOption).join('');
  updateEstimate();
}

function renderTicks(blocks, preview) {
  RD.mount('ticks').innerHTML = blocks.map((block) =>
    '<i class="' + (preview.has(block.id) ? '' : 'cut') + '" title="' + RD.esc(block.id + ' · ' + block.kind) + '"></i>'
  ).join('');
}

function renderPreview(blocks, preview, standardPack) {
  const selectedBlocks = blocks.filter((block) => preview.has(block.id));
  RD.mount('preview').innerHTML =
    '<div class="preview-head"><span class="lbl">标准本前段 · ' + selectedBlocks.length + ' 块</span><span class="tag">原文</span></div>' +
    (selectedBlocks.length ? selectedBlocks.map((block) =>
      '<div class="blk" data-kind="' + RD.esc(block.kind) + '" data-block="' + RD.esc(block.id) + '">' +
      '<span class="blk-n">' + RD.esc(block.id) + '</span><p>' +
      (block.kind === 'image' ? '[图] ' + RD.esc(block.alt || block.text || '') : RD.esc(block.text)) + '</p></div>'
    ).join('') : '<p class="empty">标准本尚未投影；生成后这里会显示保留的块。</p>') +
    '<div class="preview-foot"><span>只显示前 ' + selectedBlocks.length + ' 块，全文见读本</span>' +
    (standardPack ? '<a href="' + RD.readerHref(data.book.uid, data.chapter.n, 'standard', data.path) + '">打开标准本 →</a>' : '') + '</div>';
}

function renderPacks(generated) {
  RD.mount('packs').innerHTML = generated.length ? generated.map((tier) =>
    '<div class="pack-item"><span class="nm"><i style="--tc:var(--tier-' + tier.key + ')"></i><b>' + RD.esc(tier.name) + '本</b></span>' +
    '<span class="meta">' + (tier.stats ? 'C ' + Math.round(tier.stats.c_char * 100) + '% · ' + RD.fmt(tier.stats.minutes) + ' 分钟' : '已生成') +
    (tier.stale ? ' · 原文已改' : draft ? ' · 草稿' : '') + '</span><a href="' + RD.readerHref(data.book.uid, data.chapter.n, tier.key, data.path) + '">打开 →</a></div>'
  ).join('') : '<div class="pack-item"><span class="nm"><b>尚未出片</b></span><span class="pending">选档后生成</span></div>';
}

function renderGates() {
  const gates = data.gates || [];
  RD.mount('gates').innerHTML = gates.length ? gates.map((gate) =>
    '<div class="gate-row ' + (gate.status === 'fail' ? 'fail' : gate.status === 'warn' ? 'warn' : '') + '">' +
    '<b>' + RD.esc(gate.id) + '</b><span>' + RD.esc(gate.name) + ' · ' + RD.esc(gate.detail) + '</span></div>'
  ).join('') : '<div class="gate-row"><b>—</b><span>还没有生成记录；出片后写入 G1 / G3 / G4 / G6。</span></div>';
}

function depthStatusName(status) {
  return { missing: '未生成', running: '生成中', ready: '已就绪', stale: '已过期', failed: '失败' }[status] || status;
}

function depthRow(key) {
  const info = ((data.depth || {}).layers || {})[key] || {};
  const status = info.status || 'missing';
  const running = status === 'running';
  const blocked = Boolean((data.depth || {}).preflight && data.depth.preflight.ok === false);
  const disabled = running || depthBusy || blocked;
  const estimate = info.estimate || {};
  const actual = info.usage
    ? RD.fmt(info.tokens) + ' tokens · $' + Number(info.usd || 0).toFixed(4)
    : status === 'ready' ? '实际 无调用' : '实际 —';
  return '<div class="depth-row depth-' + RD.esc(status) + '" data-depth-row="' + RD.esc(key) + '">' +
    '<label class="depth-check"><input type="checkbox" data-depth-layer="' + RD.esc(key) + '"' +
      (depthSelected && depthSelected.has(key) ? ' checked' : '') + (disabled ? ' disabled' : '') + '>' +
      '<span>' + RD.esc(RD.depthNames[key]) + '</span></label>' +
    '<span class="depth-pill ' + RD.esc(status) + '">' + RD.esc(depthStatusName(status)) + '</span>' +
    '<span class="depth-meta">估算 ' + RD.fmt(estimate.tokens || 0) + ' tokens / $' +
      Number(estimate.usd || 0).toFixed(4) + ' · ' + actual + '</span>' +
    (info.error ? '<span class="depth-error">' + RD.esc(info.error) + '</span>' : '') +
    '<button class="btn btn-ghost depth-one" type="button" data-depth-one="' + RD.esc(key) + '"' +
      (disabled ? ' disabled' : '') + '>' + (status === 'failed' ? '重试' : '只生成此层') + '</button>' +
    '</div>';
}

function depthPanelHtml() {
  if (!data.depth) return '';
  const layers = data.depth.layers || {};
  const stale = data.depth.state === 'stale';
  const staleText = data.depth.reason || '源文已变更，旧层已过期';
  const preflight = data.depth.preflight || null;
  const blocked = Boolean(preflight && preflight.ok === false);
  const running = depthBusy || DEPTH_KEYS.some((key) => (layers[key] || {}).status === 'running');
  const preflightHtml = preflight ? '<p class="depth-preflight' + (blocked ? ' blocked' : '') + '">' +
    '本章 ' + RD.fmt(preflight.stats.blocks || 0) + ' 块 · ' + RD.fmt(preflight.stats.chunks || 0) + ' 个分块 · ' +
    '单块最多 ' + RD.fmt(preflight.stats.max_chunk_blocks || 0) + ' 块 · 预计 ' +
    RD.fmt(preflight.stats.estimated_output_tokens || 0) + ' 输出 token · 约 ' +
    RD.fmt(preflight.stats.estimated_seconds || 0) + ' 秒' +
    ((preflight.warnings || []).length ? '<br>警告：' + preflight.warnings.map(RD.esc).join('；') : '') +
    '</p>' : '';
  const blockedHtml = blocked ? '<p class="depth-warning">' +
    RD.esc(preflight.remediation || '源文件过大，先拆分 md。') +
    '<br>md 目录：books/' + RD.esc(UID) + '/md/</p>' : '';
  return '<div class="section-title"><h2>深度生产</h2><span class="lbl">逐层生成 · 可单独重跑</span></div>' +
    '<div class="depth-panel" id="depth-panel">' +
      preflightHtml +
      blockedHtml +
      (stale ? '<p class="depth-warning">' + RD.esc(staleText) + '</p>' : '') +
      DEPTH_KEYS.map(depthRow).join('') +
      '<div class="depth-actions">' +
        '<button class="btn btn-primary" id="depth-generate" type="button"' + ((running || blocked) ? ' disabled' : '') + '>' + depthGenerateLabel() + '</button>' +
        '<button class="btn btn-ghost" id="depth-rebuild-model" type="button"' + ((running || blocked) ? ' disabled' : '') + '>只重建结构模型</button>' +
      '</div>' +
      '<div id="depth-jobs"></div>' +
    '</div>';
}

function depthGenerateLabel() {
  const selected = depthSelected ? depthSelected.size : DEPTH_KEYS.length;
  const kept = DEPTH_KEYS.length - selected;
  if (!selected) return '没有要生成的层';
  return kept > 0 ? '生成所选层（保留 ' + kept + ' 层）' : '生成全部五层';
}

function refreshDepthPanel() {
  const root = RD.mount('depth-root');
  if (root) root.innerHTML = depthPanelHtml();
}

function markPreflightBlocked(payload) {
  if (!data.depth) return;
  data.depth.preflight = {
    ok: false,
    code: payload.code,
    warnings: [],
    remediation: payload.remediation || null,
    stats: payload.stats || {},
  };
  refreshDepthPanel();
}

function blockedCardHtml(payload) {
  const stats = payload.stats || {};
  return '<div class="job-inline open"><div class="job-head"><span class="eyebrow">预检未通过</span>' +
    '<span class="job-state warn">已阻断</span></div>' +
    '<div class="job-title">' + RD.esc(payload.error || '源文件过大') + '</div>' +
    '<p class="job-error">本章 ' + RD.fmt(stats.blocks || 0) + ' 块 · ' +
      RD.fmt(stats.chunks || 0) + ' 个分块 · 约 ' +
      RD.fmt(stats.estimated_output_tokens || 0) + ' 输出 token</p>' +
    (payload.remediation ? '<p class="job-error">' + RD.esc(payload.remediation) + '</p>' : '') +
    '<p class="job-meta">md 目录：books/' + RD.esc(UID) + '/md/</p></div>';
}

function bindDepth() {
  const root = RD.mount('depth-root');
  if (!root) return;
  root.addEventListener('change', (event) => {
    const input = event.target.closest('input[data-depth-layer]');
    if (!input || !depthSelected) return;
    if (input.checked) depthSelected.add(input.value); else depthSelected.delete(input.value);
    const button = document.getElementById('depth-generate');
    if (button) button.textContent = depthGenerateLabel();
  });
  root.addEventListener('click', (event) => {
    const one = event.target.closest('[data-depth-one]');
    if (one) {
      const key = one.getAttribute('data-depth-one');
      submitDepth([key], key === 'model');
      return;
    }
    if (event.target.closest('#depth-generate')) {
      submitDepth(DEPTH_KEYS.filter((key) => depthSelected && depthSelected.has(key)), false);
    } else if (event.target.closest('#depth-rebuild-model')) {
      submitDepth(['model'], true);
    }
  });
}

async function submitDepth(layers, rebuildModel) {
  if (depthBusy || !data.depth) return;
  if (!layers.length) {
    RD.toast('至少选一层', true);
    return;
  }
  depthBusy = true;
  refreshDepthPanel();
  const mount = RD.mount('depth-jobs');
  const send = async (allowUnverified) => {
    try {
      const settings = RD.modelSettings();
      const job = await RD.api('/api/depth/' + encodeURIComponent(UID) + '/' + encodeURIComponent(N), {
        method: 'POST',
        body: {
          layers,
          model: settings.model,
          effort: settings.effort,
          rebuild_model: Boolean(rebuildModel),
          allow_unverified: Boolean(allowUnverified),
        },
      });
      if (mount) {
        const slot = document.createElement('div');
        slot.setAttribute('data-depth-job', job.id);
        mount.appendChild(slot);
        mount.classList.add('open');
        RD.pollJob(job.id, slot, async (finished) => {
          depthBusy = false;
          const failed = finished.state === 'failed';
          const blocked = finished.state === 'blocked';
          RD.toast(failed || blocked
            ? (finished.error || (blocked ? '源文件过大，已阻断' : '深度生成失败'))
            : '深度层已生成 · ' + RD.statusName[finished.state], failed || blocked);
          await load();
        });
      }
    } catch (err) {
      depthBusy = false;
      if (err.status === 422 && err.payload && err.payload.code === 'source_too_large') {
        const payload = err.payload;
        markPreflightBlocked(payload);
        const liveMount = RD.mount('depth-jobs');
        if (liveMount) {
          liveMount.innerHTML = blockedCardHtml(payload);
          liveMount.classList.add('open');
        }
        RD.toast(payload.error || '源文件过大', true);
        return;
      }
      refreshDepthPanel();
      if (err.code === 'job_active') {
        RD.toast('该章已有任务在跑，先去生成记录看进度', true);
      } else if (err.code === 'missing_config' && err.payload && err.payload.degradable && !allowUnverified &&
          window.confirm(err.payload.error + '\n\n' + (err.payload.missing[0] ? err.payload.missing[0].fix : '') +
            '\n\n先按「未检索议程」继续？')) {
        return send(true);
      } else {
        RD.toast(err.message, true);
      }
    }
  };
  return send(false);
}


function bindTicket() {
  bindMode();
  RD.mount('tier-list').addEventListener('change', (event) => {
    const input = event.target.closest('input[type=checkbox]');
    if (!input) return;
    if (input.checked) selected.add(input.value); else selected.delete(input.value);
    input.closest('.tier-opt').classList.toggle('checked', input.checked);
    updateEstimate();
  });
  RD.mount('generate').addEventListener('click', generate);
  RD.mount('generate-edition').addEventListener('click', generateEdition);
  RD.bindModelSettings();
  updateEstimate();
}

function planFor(keys) {
  const existing = (data.tiers || []).filter((tier) => tier.exists).map((tier) => tier.key);
  const existingSelected = existing.filter((key) => keys.includes(key));
  const unselected = existing.filter((key) => !keys.includes(key));
  const destructive = Boolean(unselected.length && data.pack && data.pack.preservable === false);
  return { existingSelected, unselected, destructive, reason: data.pack && data.pack.preserve_reason };
}

function planText(keys, plan) {
  const head = plan.existingSelected.length ? '将重新生成：' : '将新增：';
  let text = head + keys.map((key) => RD.tierNames[key]).join('、');
  if (plan.unselected.length) {
    text += (plan.destructive ? '；未勾选档位将被移除：' : '；保留：') +
      plan.unselected.map((key) => RD.tierNames[key]).join('、');
  }
  if (plan.destructive && plan.reason) text += '（' + plan.reason + '）';
  return text;
}

function updateEstimate() {
  if (!RD.mount('ticket-est')) return;
  const keys = TIER_KEYS.filter((key) => selected.has(key));
  const active = keys.filter((key) => pending.has(key) || RD.jobForTier(data.jobs, key));
  const button = RD.mount('generate');
  if (button) {
    button.disabled = keys.length === 0 || pendingBusy;
    button.textContent = pendingBusy ? '正在提交…' : active.length ? '查看进行中的工单' :
      keys.length ? '生成 ' + keys.length + ' 档读本 →' : '至少选一档';
  }
  const mode = (data.reading || {}).effective_mode || 'argument';
  const hasProfile = Boolean((data.reading || {}).book_mode);
  if (button) {
    button.disabled = keys.length === 0 || pendingBusy || !hasProfile;
    button.title = hasProfile ? '' : '先选一个读法，设为本书默认';
    button.textContent = hasProfile
      ? '按「' + modeLabel(mode) + '」生成读本 →'
      : '先选一个读法 →';
  }
  RD.mount('ticket-est').textContent = keys.length
    ? '按「' + modeLabel(mode) + '」生成 ' + keys.length + ' 档 · ' + planText(keys, planFor(keys)) +
      ' · ' + RD.fmt(data.chapter.chars) + ' 字'
    : '未选档位';
}

function jobSlot(job) {
  const mount = RD.mount('job-mount');
  return mount ? mount.querySelector('[data-job-slot="' + job.id + '"]') : null;
}

function showJobs(jobs) {
  const mount = RD.mount('job-mount');
  if (!mount || !jobs.length) return;
  jobs.forEach((job) => {
    let slot = jobSlot(job);
    if (!slot) {
      slot = document.createElement('div');
      slot.setAttribute('data-job-slot', job.id);
      mount.appendChild(slot);
    }
    slot.innerHTML = RD.jobCard(job);
    const card = slot.querySelector('.job-inline');
    if (card) card.classList.add('open');
  });
  mount.classList.add('open');
}

function watchJob(job, onDone) {
  const slot = jobSlot(job);
  if (!slot || polling.has(job.id)) return;
  polling.add(job.id);
  RD.pollJob(job.id, slot, async (finished) => {
    polling.delete(finished.id);
    if (onDone) onDone(finished);
    await load();
  }, (updated) => {
    const index = data.jobs.findIndex((item) => item.id === updated.id);
    if (index >= 0) data.jobs[index] = updated; else data.jobs.push(updated);
    if (['done', 'partial', 'failed', 'cancelled'].includes(updated.state)) polling.delete(updated.id);
    refreshTiers();
  });
}

async function postJob(keys, overwrite, rebuild, allowUnverified) {
  const settings = RD.modelSettings();
  return RD.api('/api/jobs', { method: 'POST', body: {
    uid: data.book.uid, n: data.chapter.n, tiers: keys, model: settings.model, effort: settings.effort,
    mode: (data.reading || {}).effective_mode, reading_hash: JSON.stringify(data.reading || {}),
    overwrite: Boolean(overwrite), rebuild: Boolean(rebuild), allow_unverified: Boolean(allowUnverified),
  } });
}

async function generateEdition() {
  if (!window.confirm('生成视觉读本会调用模型，约 30–60 秒，并用当前原文重建这一章的版式。继续吗？')) return;
  const button = RD.mount('generate-edition');
  button.disabled = true;
  button.textContent = '正在提交…';
  try {
    const settings = RD.modelSettings();
    const job = await RD.api('/api/edition/' + encodeURIComponent(UID) + '/' + encodeURIComponent(N), {
      method: 'POST',
      body: { model: settings.model, effort: settings.effort, overwrite: Boolean(data.edition) },
    });
    location.href = RD.recordsJobHref(job.id);
  } catch (err) {
    button.disabled = false;
    button.textContent = '生成视觉读本（模型约 30–60 秒）';
    if (err.code === 'job_active') {
      RD.toast('这一章已有任务在跑，先去生成记录看进度', true);
    } else {
      RD.toast(err.message, true);
    }
  }
}

async function generate() {
  const keys = TIER_KEYS.filter((key) => selected.has(key));
  if (!keys.length) return;
  if (!(data.reading || {}).book_mode) {
    RD.toast('先在右侧选一个读法，设本书默认', true);
    return;
  }
  if (pendingBusy) {
    RD.toast('正在提交，请稍候', true);
    return;
  }
  const active = keys.map((key) => RD.jobForTier(data.jobs, key)).filter(Boolean);
  if (active.length) {
    location.href = RD.recordsJobHref(active[0].id);
    return;
  }
  const plan = planFor(keys);
  const summary = planText(keys, plan);
  let overwrite = false;
  let rebuild = false;
  if (plan.destructive) {
    if (!window.confirm(summary + '。未勾选档位将被移除，整包重建为所选档位，确定吗？')) return;
    overwrite = true;
    rebuild = true;
  } else if (plan.existingSelected.length) {
    if (!window.confirm(summary + '。继续会重新生成并覆盖所选档位，确定吗？')) return;
    overwrite = true;
  }
  const mount = RD.mount('job-mount');
  pendingBusy = true;
  keys.forEach((key) => pending.add(key));
  refreshTiers();
  try {
    let job;
    try {
      job = await postJob(keys, overwrite, rebuild);
    } catch (err) {
      if (err.code === 'pack_exists' && !overwrite) {
        const labels = (err.payload.tiers || keys).map((key) => RD.tierNames[key] || key).join('、');
        if (!window.confirm(labels + ' 已有读本。' + summary + '。继续会重新生成并覆盖，确定吗？')) throw err;
        job = await postJob(keys, true, rebuild);
      } else if (err.code === 'rebuild_required' && !rebuild) {
        const labels = (err.payload.tiers || []).map((key) => RD.tierNames[key] || key).join('、');
        if (!window.confirm('未勾选档位将被移除：' + labels + '（' + (err.payload.reason || '原文或生成模式已变化') +
            '），整包重建为所选档位。确定吗？')) throw err;
        job = await postJob(keys, true, true);
      } else if (err.code === 'missing_config' && err.payload && err.payload.degradable) {
        const fix = err.payload.missing && err.payload.missing[0] ? err.payload.missing[0].fix : '';
        if (!window.confirm(err.payload.error + '\n\n' + fix + '\n\n先按「未检索议程」继续？')) throw err;
        job = await postJob(keys, overwrite, rebuild, true);
      } else {
        throw err;
      }
    }
    data.jobs = (data.jobs || []).concat([job]);
    showJobs([job]);
    watchJob(job, (finished) => {
      RD.toast(finished.state === 'failed' ? (finished.error || '生成失败') : '读本已生成 · ' + RD.statusName[finished.state], finished.state === 'failed');
    });
  } catch (err) {
    if (err.code === 'job_active') {
      const conflicts = err.conflicts || [];
      const jobs = data.jobs || [];
      conflicts.forEach((item) => {
        if (!jobs.some((job) => job.id === item.id)) jobs.push(item);
      });
      data.jobs = jobs;
      showJobs(conflicts);
      conflicts.forEach((item) => watchJob(item, null));
      refreshTiers();
      RD.toast(err.message, true);
    } else if (err.status === 422 && err.payload && err.payload.code === 'source_too_large') {
      markPreflightBlocked(err.payload);
      if (mount) {
        const banner = document.createElement('div');
        banner.innerHTML = blockedCardHtml(err.payload);
        mount.appendChild(banner);
        mount.classList.add('open');
      }
      RD.toast(err.payload.error || '源文件过大', true);
    } else {
      if (mount) {
        const banner = document.createElement('div');
        banner.innerHTML = '<div class="job-inline open"><p class="job-error">' + RD.esc(err.message) + '</p></div>';
        mount.appendChild(banner);
        mount.classList.add('open');
      }
      RD.toast(err.message, true);
    }
  } finally {
    pendingBusy = false;
    pending.clear();
    refreshTiers();
  }
}

function bind() { bindDepth(); }
</script>
</body>
</html>
