<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>书库 · 今天读哪一页</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="page">
  <header class="masthead">
    <div class="brand">
      <span class="seal" aria-hidden="true">书</span>
      <div>
        <h1>书库</h1>
        <p>私人藏书 · 本地实例</p>
      </div>
    </div>
    <div class="dateline">
      <div><b>{{TODAY}}</b><span class="sep">/</span>{{WEEKDAY}}</div>
      <div>{{READABLE}} 本可读</div>
    </div>
  </header>

  <main class="main">
    <section aria-labelledby="toc-title">
      <div class="section-head">
        <span class="eyebrow" id="toc-title">目录</span>
        <span class="hint">按 1 – 3 直接进入</span>
      </div>
      <ol class="toc">
        <li>
          <a class="row" href="{{SEARCH_URL}}" target="_blank" rel="noopener" data-key="1">
            <span class="num">壹</span>
            <span>
              <span class="title">找一段</span>
              <span class="desc">问一句，找到原文。答案后面带着出处。</span>
            </span>
            <span class="meta">原文与出处</span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
        </li>
        <li>
          <a class="row" href="{{READING_URL}}" target="_blank" rel="noopener" data-key="2">
            <span class="num">贰</span>
            <span>
              <span class="title">翻开书</span>
              <span class="desc">速览、标准、深读三档，原文一字不改，讲解只作旁批。</span>
            </span>
            <span class="meta">{{READABLE}} 本可读</span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
        </li>
        <li>
          <a class="row" href="{{DAILY_URL}}" target="_blank" rel="noopener" data-key="3">
            <span class="num">叁</span>
            <span>
              <span class="title">往期日课</span>
              <span class="desc">每天一章，一段话。前面几期都在这里。</span>
            </span>
            <span class="meta">{{ISSUE_COUNT}} 期</span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
        </li>
      </ol>
    </section>

    <aside class="aside">
      <span class="aside-tab">今日夹页</span>
      {{DAILY_CARD}}
      <p class="aside-note">{{ASIDE_NOTE}}</p>
    </aside>
  </main>

  <footer class="foot">
    <span class="keys">
      <span><kbd>1</kbd> 找一段</span><span><kbd>2</kbd> 翻开书</span><span><kbd>3</kbd> 往期日课</span>
    </span>
    <a class="admin" href="{{OPS_URL}}" target="_blank" rel="noopener">管理</a>
  </footer>
</div>
<script>
  addEventListener("keydown", (event) => {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    const link = document.querySelector(`[data-key="${event.key}"]`);
    if (!link) return;
    event.preventDefault();
    window.open(link.href, "_blank", "noopener");
  });
</script>
</body>
</html>
