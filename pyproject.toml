[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "book-corpus"
version = "0.2.0"
description = "本地电子书库工具箱：入库、拆章、索引、检索、问答"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = [
  "pymupdf>=1.24,<2",
  "pypdf>=4",
  "requests>=2.31",
  "numpy>=1.26",
  "pillow>=10",
  "beautifulsoup4>=4.12",
]
rerank = ["torch>=2.2", "transformers>=4.40"]

[project.scripts]
book-corpus = "bookcorpus.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/bookcorpus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
